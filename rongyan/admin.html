<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>绒颜 · 手机管理后台</title>
<link rel="icon" href="../logo.jpg" type="image/jpeg">
<script src="https://cdn.jsdelivr.net/npm/compressorjs@1.2.1/dist/compressor.min.js"></script>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  :root {
    --primary: #b8860b; --bg: #f5f5f7; --card: #fff; --text: #1c1c1e;
    --text2: #8e8e93; --border: #e5e5ea; --danger: #ff3b30; --success: #34c759;
  }
  body { font-family: -apple-system, sans-serif; background: var(--bg); color: var(--text); font-size: 15px; padding: 16px; padding-bottom: 100px; }
  .top-bar { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
  .top-bar h2 { margin: 0; color: var(--primary); font-size: 20px; }
  .top-bar-actions { display: flex; align-items: center; gap: 12px; }
  .home-btn {
    background: none; border: 1px solid var(--primary); color: var(--primary);
    font-size: 14px; cursor: pointer; font-weight: 500; padding: 5px 12px;
    border-radius: 6px; text-decoration: none; transition: all 0.2s;
  }
  .home-btn:active { opacity: 0.6; background: rgba(184,134,11,0.08); }
  .logout-btn { background: none; border: none; color: var(--danger); font-size: 14px; cursor: pointer; font-weight: 500; }
  .logout-btn:active { opacity: 0.6; }

  .auth-overlay {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: var(--bg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    z-index: 9999; padding: 20px;
  }
  .auth-box {
    width: 100%; max-width: 350px; background: var(--card); padding: 30px 24px;
    border-radius: 16px; box-shadow: 0 10px 30px rgba(0,0,0,0.08); text-align: center;
  }
  .auth-box .lock-icon { font-size: 50px; margin-bottom: 16px; }
  .auth-box h3 { font-size: 20px; margin-bottom: 8px; color: var(--text); }
  .auth-box p { font-size: 14px; color: var(--text2); margin-bottom: 24px; }
  .auth-input {
    width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 16px; text-align: center; outline: none; margin-bottom: 12px; background: #fafafa;
  }
  .auth-input:focus { border-color: var(--primary); background: #fff; }
  .auth-btn {
    width: 100%; padding: 14px; background: var(--primary); color: #fff; border: none;
    border-radius: 10px; font-size: 16px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-top: 8px;
  }
  .auth-btn:active { transform: scale(0.96); }
  .auth-btn:disabled { background: #ccc; }

  .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
  .tab {
    flex: 1; padding: 12px; text-align: center; background: var(--card); border: 1px solid var(--border);
    border-radius: 10px; font-size: 16px; font-weight: 600; color: var(--text2); cursor: pointer; transition: all 0.2s;
  }
  .tab.active { background: var(--primary); color: #fff; border-color: var(--primary); box-shadow: 0 4px 10px rgba(184,134,11,0.3); }
  
  .form-group { margin-bottom: 18px; }
  .form-label { display: block; font-size: 14px; font-weight: 600; color: var(--text2); margin-bottom: 6px; }
  .form-input, .form-select, .form-textarea {
    width: 100%; padding: 14px; border: 1px solid var(--border); border-radius: 10px;
    font-size: 16px; background: var(--card); outline: none; -webkit-appearance: none;
  }
  .form-input:focus, .form-select:focus, .form-textarea:focus { border-color: var(--primary); }
  .form-textarea { min-height: 80px; font-family: inherit; resize: vertical;}
  
  .upload-area {
    border: 2px dashed var(--primary); border-radius: 12px; padding: 30px 10px; text-align: center;
    background: #fffbf0; cursor: pointer; transition: all 0.2s;
  }
  .upload-area:active { transform: scale(0.98); background: #fff5e0;}
  .upload-area .icon { font-size: 40px; }
  .upload-area p { font-size: 14px; color: var(--text2); margin-top: 8px; }
  .upload-area input { display: none; }
  
  .preview-list { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; margin-top: 15px; }
  .preview-item {
    position: relative; aspect-ratio: 1; border-radius: 8px; overflow: hidden;
    background: #eee; box-shadow: 0 2px 8px rgba(0,0,0,0.1);
  }
  .preview-item img { width: 100%; height: 100%; object-fit: cover; }
  .preview-item .badge { position: absolute; top: 4px; left: 4px; background: var(--primary); color: #fff; font-size: 10px; padding: 2px 6px; border-radius: 4px; }
  .preview-item .badge.new { background: var(--success); }
  .preview-item .remove-btn {
    position: absolute; top: 4px; right: 4px; width: 22px; height: 22px; background: rgba(0,0,0,0.6);
    color: #fff; border: none; border-radius: 50%; font-size: 14px; display: flex; align-items: center; justify-content: center;
  }

  .btn {
    width: 100%; padding: 16px; border: none; border-radius: 14px;
    font-size: 18px; font-weight: 600; cursor: pointer; transition: all 0.2s; margin-bottom: 10px;
  }
  .btn:active { transform: scale(0.96); }
  .btn:disabled { background: #ccc !important; box-shadow: none !important; color: #999; }
  .btn-primary { background: var(--primary); color: #fff; box-shadow: 0 4px 20px rgba(184,134,11,0.4); }
  .btn-danger { background: #fff; color: var(--danger); border: 1px solid var(--danger); }
  .btn-back { background: #fff; color: var(--text); border: 1px solid var(--border); font-size: 16px; padding: 12px;}

  .product-list { display: flex; flex-direction: column; gap: 12px; }
  .product-card {
    display: flex; align-items: center; gap: 12px; background: var(--card); padding: 12px;
    border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.05); cursor: pointer; transition: all 0.2s;
  }
  .product-card:active { transform: scale(0.98); background: #fafafa; }
  .product-card img { width: 60px; height: 60px; object-fit: cover; border-radius: 8px; background: #eee;}
  .product-info { flex: 1; }
  .product-info h3 { font-size: 16px; margin-bottom: 4px; }
  .product-info p { font-size: 13px; color: var(--text2); }

  .toast {
    position: fixed; top: 50%; left: 50%; transform: translate(-50%, -50%);
    background: rgba(0,0,0,0.85); color: #fff; padding: 16px 28px; border-radius: 10px;
    font-size: 15px; z-index: 99999; opacity: 0; transition: opacity 0.3s; pointer-events: none;
    text-align: center; max-width: 80%;
  }
  .toast.show { opacity: 1; }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- 1. 密码验证遮罩层 -->
<div id="authOverlay" class="auth-overlay">
  <div class="auth-box">
    <div class="lock-icon">🔒</div>
    <h3>绒颜 · 管理后台</h3>
    <p>请输入管理员账号和密码</p>
    <input type="text" id="emailInput" class="auth-input" placeholder="管理员账号" autocomplete="off">
    <input type="password" id="passwordInput" class="auth-input" placeholder="请输入密码" autocomplete="off">
    <button class="auth-btn" onclick="doLogin()">验证并进入</button>
  </div>
</div>

<!-- 2. 主应用内容 -->
<div id="mainApp" style="display:none;">
  <div class="top-bar">
    <h2>📦 绒颜 · 管理后台</h2>
    <div class="top-bar-actions">
      <a href="index.html" class="home-btn">🏠 首页</a>
      <button class="logout-btn" onclick="doLogout()">退出登录</button>
    </div>
  </div>

  <div class="tabs" id="mainTabs">
    <button class="tab active" onclick="switchTab('add')">➕ 添加产品</button>
    <button class="tab" onclick="switchTab('manage')">✏️ 管理产品</button>
  </div>

  <!-- 视图：添加产品 -->
  <div id="view-add">
    <div class="form-group">
      <label class="form-label">产品名称 *</label>
      <input type="text" class="form-input" id="fName" placeholder="例：绒花｜紫玉">
    </div>
    <div class="form-group">
      <label class="form-label">分类 *</label>
      <select class="form-select" id="fCategory">
        <option value="发饰">发饰</option><option value="耳饰">耳饰</option><option value="胸针">胸针</option>
        <option value="胸饰">胸饰</option><option value="头饰">头饰</option><option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">价格（元）</label>
      <input type="number" class="form-input" id="fPrice" value="0" min="0" step="0.1">
    </div>
    <div class="form-group">
      <label class="form-label">描述</label>
      <textarea class="form-textarea" id="fDesc" placeholder="产品描述、材质、尺寸等..."></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">产品图片（可多选，第一张为封面，自动压缩）</label>
      <div class="upload-area" onclick="document.getElementById('fileInput').click()">
        <div class="icon">📷</div>
        <p>点击这里，从手机相册选图</p>
        <input type="file" id="fileInput" multiple accept="image/*">
      </div>
      <div class="preview-list" id="previewList"></div>
    </div>
    <button class="btn btn-primary" id="submitBtn" onclick="submitProduct('add')">🚀 保存并上传到 GitHub</button>
  </div>

  <!-- 视图：管理产品列表 -->
  <div id="view-manage" class="hidden">
    <div class="product-list" id="productList">
      <p style="text-align:center; color:#999; padding:40px 0;">加载中...</p>
    </div>
  </div>

  <!-- 视图：编辑产品 -->
  <div id="view-edit" class="hidden">
    <button class="btn btn-back" onclick="switchTab('manage')">← 返回产品列表</button>
    <div style="height: 16px;"></div>
    <div class="form-group">
      <label class="form-label">产品名称 *</label>
      <input type="text" class="form-input" id="eName">
    </div>
    <div class="form-group">
      <label class="form-label">分类 *</label>
      <select class="form-select" id="eCategory">
        <option value="发饰">发饰</option><option value="耳饰">耳饰</option><option value="胸饰">胸饰</option><option value="头饰">头饰</option><option value="其他">其他</option>
      </select>
    </div>
    <div class="form-group">
      <label class="form-label">价格（元）</label>
      <input type="number" class="form-input" id="ePrice" min="0" step="0.1">
    </div>
    <div class="form-group">
      <label class="form-label">描述</label>
      <textarea class="form-textarea" id="eDesc"></textarea>
    </div>
    <div class="form-group">
      <label class="form-label">产品图片（点击 × 删除老图，或上传新图）</label>
      <div class="upload-area" onclick="document.getElementById('editFileInput').click()">
        <div class="icon">📷</div>
        <p>点击补充新图片</p>
        <input type="file" id="editFileInput" multiple accept="image/*">
      </div>
      <div class="preview-list" id="editPreviewList"></div>
    </div>
    <button class="btn btn-primary" id="updateBtn" onclick="submitProduct('edit')">💾 保存修改</button>
    <button class="btn btn-danger" onclick="deleteProduct()">🗑️ 彻底删除此产品</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
  // ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️
  // 👇 请修改为你自己的 GitHub 配置 👇
  // ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️
  const GITHUB_CONFIG = {
    token: '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',
    owner: 'yangruan1688',
    repo: 'yangruan.github.io',
    branch: 'main',           // 分支名，一般是 main
    imageDir: 'images',       // 图片存放目录
    dataFile: 'products.json' // 产品数据文件名
  };

  // 管理员登录账号密码（本地验证，不使用云端）
  const ADMIN_USER = 'admin';
  const ADMIN_PASS = '10211688';
  // ⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️⚠️

  // ==========================================
  // 🔧 GitHub API 工具函数
  // ==========================================
  const API_BASE = `https://api.github.com/repos/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}`;
  const RAW_BASE = `https://raw.githubusercontent.com/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}/${GITHUB_CONFIG.branch}`;

  function githubHeaders() {
    return {
      'Authorization': 'Bearer ' + GITHUB_CONFIG.token,
      'Accept': 'application/vnd.github.v3+json',
      'Content-Type': 'application/json',
      'X-GitHub-Api-Version': '2022-11-28'
    };
  }

  // 获取文件内容和 SHA（用于更新）
  async function getFileFromGithub(filePath) {
    const res = await fetch(`${API_BASE}/contents/${filePath}?ref=${GITHUB_CONFIG.branch}`, {
      headers: githubHeaders()
    });
    if (res.status === 404) return null; // 文件不存在
    if (!res.ok) throw new Error(`GitHub API 错误: ${res.status}`);
    const data = await res.json();
    return {
      content: atob(data.content.replace(/\n/g, '')),
      sha: data.sha
    };
  }

  // 上传/更新文件到 GitHub
  async function uploadFileToGithub(filePath, base64Content, message, existingSha) {
    const body = {
      message: message,
      content: base64Content,
      branch: GITHUB_CONFIG.branch
    };
    if (existingSha) body.sha = existingSha;

    const res = await fetch(`${API_BASE}/contents/${filePath}`, {
      method: 'PUT',
      headers: githubHeaders(),
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `上传失败 (${res.status})`);
    }
    const data = await res.json();
    return data.content.download_url;
  }

  // 删除 GitHub 上的文件
  async function deleteFileFromGithub(filePath, sha, message) {
    const res = await fetch(`${API_BASE}/contents/${filePath}`, {
      method: 'DELETE',
      headers: githubHeaders(),
      body: JSON.stringify({
        message: message,
        sha: sha,
        branch: GITHUB_CONFIG.branch
      })
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      console.warn('删除文件失败:', err.message);
    }
  }

  // 压缩图片 → base64
  function compressImage(file) {
    return new Promise((resolve, reject) => {
      new Compressor(file, {
        quality: 0.7, maxWidth: 1200, maxHeight: 1200,
        mimeType: 'image/jpeg', convertSize: 1000000,
        success: resolve, error: reject,
      });
    });
  }

  // 将 File/Blob 转为纯 base64 字符串（不含 data:image 前缀）
  function blobToBase64(blob) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = () => {
        const base64 = reader.result.split(',')[1];
        resolve(base64);
      };
      reader.onerror = reject;
      reader.readAsDataURL(blob);
    });
  }

  // ==========================================
  // 📦 产品数据 CRUD（读写 products.json）
  // ==========================================
  let _productsCache = null;
  let _productsSha = null;

  async function loadProducts() {
    const file = await getFileFromGithub(GITHUB_CONFIG.dataFile);
    if (!file) {
      _productsCache = [];
      _productsSha = null;
      return [];
    }
    _productsCache = JSON.parse(file.content);
    _productsSha = file.sha;
    return _productsCache;
  }

  async function saveProducts(products, commitMessage) {
    const jsonStr = JSON.stringify(products, null, 2);
    const base64 = btoa(unescape(encodeURIComponent(jsonStr)));
    await uploadFileToGithub(
      GITHUB_CONFIG.dataFile,
      base64,
      commitMessage || '更新产品数据',
      _productsSha // 如果是首次创建，sha 为 null，GitHub 会自动创建文件
    );
    _productsCache = products;
    // 更新 SHA（上传后会变）
    const file = await getFileFromGithub(GITHUB_CONFIG.dataFile);
    if (file) _productsSha = file.sha;
  }

  function getNextId(products) {
    if (products.length === 0) return 1;
    return Math.max(...products.map(p => p.id)) + 1;
  }

  // ==========================================
  // 🔐 本地密码验证
  // ==========================================
  function checkAuth() {
    const loggedIn = localStorage.getItem('rongyan_admin') === 'true';
    if (loggedIn) {
      showMainApp();
    } else {
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('mainApp').style.display = 'none';
    }
  }

  function doLogin() {
    const user = document.getElementById('emailInput').value.trim();
    const pwd = document.getElementById('passwordInput').value;
    if (!user || !pwd) return showToast('⚠️ 请输入账号和密码');

    const btn = document.querySelector('.auth-btn');
    btn.disabled = true;
    btn.textContent = '验证中...';

    // 模拟一下延迟让体验更自然
    setTimeout(() => {
      btn.disabled = false;
      btn.textContent = '验证并进入';

      if (user === ADMIN_USER && pwd === ADMIN_PASS) {
        localStorage.setItem('rongyan_admin', 'true');
        showMainApp();
      } else {
        showToast('❌ 账号或密码错误');
        document.getElementById('passwordInput').value = '';
      }
    }, 500);
  }

  function doLogout() {
    localStorage.removeItem('rongyan_admin');
    location.reload();
  }

  function showMainApp() {
    document.getElementById('authOverlay').style.display = 'none';
    document.getElementById('mainApp').style.display = 'block';
    initApp();
  }

  document.getElementById('passwordInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') doLogin();
  });
  document.getElementById('emailInput').addEventListener('keypress', function(e) {
    if (e.key === 'Enter') document.getElementById('passwordInput').focus();
  });

  // ==========================================
  // 📦 核心业务逻辑
  // ==========================================
  let addFiles = [], editFiles = [], existingUrls = [], currentEditId = null;

  function initApp() {
    document.getElementById('fileInput').addEventListener('change', function(e) {
      addFiles = addFiles.concat(Array.from(e.target.files));
      renderAddPreviews();
      e.target.value = '';
    });

    document.getElementById('editFileInput').addEventListener('change', function(e) {
      editFiles = editFiles.concat(Array.from(e.target.files));
      renderEditPreviews();
      e.target.value = '';
    });
  }

  function switchTab(tab) {
    document.getElementById('view-add').classList.add('hidden');
    document.getElementById('view-manage').classList.add('hidden');
    document.getElementById('view-edit').classList.add('hidden');
    document.getElementById('mainTabs').classList.remove('hidden');

    if (tab === 'add') {
      document.getElementById('view-add').classList.remove('hidden');
      document.querySelectorAll('.tab')[0].classList.add('active');
      document.querySelectorAll('.tab')[1].classList.remove('active');
    } else if (tab === 'manage') {
      document.getElementById('view-manage').classList.remove('hidden');
      document.querySelectorAll('.tab')[0].classList.remove('active');
      document.querySelectorAll('.tab')[1].classList.add('active');
      loadProductList();
    } else if (tab === 'edit') {
      document.getElementById('view-edit').classList.remove('hidden');
      document.getElementById('mainTabs').classList.add('hidden');
    }
  }

  function renderAddPreviews() {
    const list = document.getElementById('previewList');
    list.innerHTML = '';
    addFiles.forEach((file, i) => {
      list.appendChild(createPreviewItem(URL.createObjectURL(file), i, 'add', i === 0));
    });
  }

  function renderEditPreviews() {
    const list = document.getElementById('editPreviewList');
    list.innerHTML = '';
    existingUrls.forEach((url, i) => {
      list.appendChild(createPreviewItem(url, i, 'existing', i === 0 && editFiles.length === 0));
    });
    editFiles.forEach((file, i) => {
      const isCover = (existingUrls.length === 0 && i === 0);
      list.appendChild(createPreviewItem(URL.createObjectURL(file), i, 'edit', isCover));
    });
  }

  function createPreviewItem(src, index, type, isCover) {
    const div = document.createElement('div');
    div.className = 'preview-item';
    const img = document.createElement('img');
    img.src = src;
    div.appendChild(img);

    if (isCover) {
      const badge = document.createElement('span');
      badge.className = 'badge';
      badge.textContent = '封面';
      div.appendChild(badge);
    } else if (type === 'edit') {
      const badge = document.createElement('span');
      badge.className = 'badge new';
      badge.textContent = '新增';
      div.appendChild(badge);
    }

    const btn = document.createElement('button');
    btn.className = 'remove-btn';
    btn.innerHTML = '×';
    btn.onclick = (ev) => { 
      ev.stopPropagation(); 
      if (type === 'add') { addFiles.splice(index, 1); renderAddPreviews(); }
      else if (type === 'edit') { editFiles.splice(index, 1); renderEditPreviews(); }
      else if (type === 'existing') { existingUrls.splice(index, 1); renderEditPreviews(); }
    };
    div.appendChild(btn);
    return div;
  }

  async function loadProductList() {
    const list = document.getElementById('productList');
    list.innerHTML = '<p style="text-align:center; color:#999; padding:40px 0;">加载中...</p>';
    
    try {
      const products = await loadProducts();
      const sorted = [...products].sort((a, b) => b.id - a.id);
      
      list.innerHTML = '';
      if (sorted.length === 0) {
        list.innerHTML = '<p style="text-align:center; color:#999; padding:40px 0;">暂无产品，请先添加</p>';
        return;
      }

      sorted.forEach(p => {
        const card = document.createElement('div');
        card.className = 'product-card';
        card.onclick = () => openEditForm(p);
        card.innerHTML = `
          <img src="${p.cover}" onerror="this.src='https://via.placeholder.com/60?text=No+Img'">
          <div class="product-info">
            <h3>${p.name}</h3>
            <p>${p.category} · ¥${p.price} · ${p.images ? p.images.length : 0}张图</p>
          </div>
        `;
        list.appendChild(card);
      });
    } catch (err) {
      console.error('加载产品列表失败:', err);
      list.innerHTML = '<p style="text-align:center; color:red;">加载失败: ' + err.message + '</p>';
    }
  }

  function openEditForm(product) {
    currentEditId = product.id;
    document.getElementById('eName').value = product.name;
    document.getElementById('eCategory').value = product.category;
    document.getElementById('ePrice').value = product.price;
    document.getElementById('eDesc').value = product.description || '';
    existingUrls = [...(product.images || [])];
    editFiles = [];
    renderEditPreviews();
    switchTab('edit');
  }

  async function submitProduct(mode) {
    const isEdit = mode === 'edit';
    const name = document.getElementById(isEdit ? 'eName' : 'fName').value.trim();
    if (!name) return showToast('⚠️ 请输入产品名称');
    
    const files = isEdit ? editFiles : addFiles;
    const oldUrls = isEdit ? existingUrls : [];
    if (files.length === 0 && oldUrls.length === 0) return showToast('⚠️ 请至少保留或上传一张图片');

    const btn = document.getElementById(isEdit ? 'updateBtn' : 'submitBtn');
    btn.disabled = true;

    try {
      // 1. 上传新图片到 GitHub
      const newUrls = [];
      for (let i = 0; i < files.length; i++) {
        btn.textContent = `⏳ 上传图片 (${i + 1}/${files.length})...`;
        
        // 压缩
        const compressed = await compressImage(files[i]);
        const base64 = await blobToBase64(compressed);
        
        // 生成文件名
        const fileName = `${Date.now()}_${Math.random().toString(36).substring(2, 8)}.jpg`;
        const filePath = `${GITHUB_CONFIG.imageDir}/${fileName}`;
        
        // 上传到 GitHub
        await uploadFileToGithub(
          filePath,
          base64,
          `上传图片: ${fileName}`,
          null // 新文件没有 sha
        );
        
        // 生成访问 URL（用 CDN 加速）
        const imageUrl = `https://cdn.jsdelivr.net/gh/${GITHUB_CONFIG.owner}/${GITHUB_CONFIG.repo}@${GITHUB_CONFIG.branch}/${filePath}`;
        newUrls.push(imageUrl);
      }

      // 2. 组装产品数据
      const finalImages = [...oldUrls, ...newUrls];
      const productData = {
        name: name,
        category: document.getElementById(isEdit ? 'eCategory' : 'fCategory').value,
        price: parseFloat(document.getElementById(isEdit ? 'ePrice' : 'fPrice').value) || 0,
        description: document.getElementById(isEdit ? 'eDesc' : 'fDesc').value,
        cover: finalImages[0],
        images: finalImages
      };

      // 3. 读取并更新 products.json
      btn.textContent = '⏳ 正在保存产品数据...';
      const products = await loadProducts();

      if (isEdit) {
        const idx = products.findIndex(p => p.id === currentEditId);
        if (idx === -1) throw new Error('找不到要编辑的产品');
        productData.id = currentEditId;
        products[idx] = productData;
        await saveProducts(products, `更新产品: ${name}`);
      } else {
        productData.id = getNextId(products);
        products.push(productData);
        await saveProducts(products, `新增产品: ${name}`);
      }

      showToast(isEdit ? '✅ 修改成功！' : '✅ 上传成功！');
      if (!isEdit) {
        document.getElementById('fName').value = '';
        document.getElementById('fDesc').value = '';
        document.getElementById('fPrice').value = '0';
        addFiles = [];
        renderAddPreviews();
      } else {
        switchTab('manage');
      }
    } catch (err) {
      console.error(err);
      showToast('❌ 失败: ' + (err.message || '请检查网络和 GitHub Token'));
    } finally {
      btn.disabled = false;
      btn.textContent = isEdit ? '💾 保存修改' : '🚀 保存并上传到 GitHub';
    }
  }

  async function deleteProduct() {
    if (!confirm('确定要彻底删除这个产品吗？此操作无法恢复！')) return;
    const btn = document.getElementById('updateBtn');
    btn.disabled = true;
    btn.textContent = '⏳ 正在删除...';
    try {
      const products = await loadProducts();
      const product = products.find(p => p.id === currentEditId);
      
      // 从列表中移除
      const newProducts = products.filter(p => p.id !== currentEditId);
      await saveProducts(newProducts, `删除产品: ${product ? product.name : currentEditId}`);

      // 尝试删除该产品的图片文件（可选，避免垃圾文件堆积）
      if (product && product.images) {
        for (const imgUrl of product.images) {
          try {
            // 从 URL 中提取文件路径
            const marker = `${GITHUB_CONFIG.repo}@${GITHUB_CONFIG.branch}/`;
            const idx = imgUrl.indexOf(marker);
            if (idx === -1) continue;
            const filePath = imgUrl.substring(idx + marker.length);
            
            const file = await getFileFromGithub(filePath);
            if (file) {
              await deleteFileFromGithub(filePath, file.sha, `删除图片: ${filePath}`);
            }
          } catch (e) {
            console.warn('删除图片失败，跳过:', e.message);
          }
        }
      }

      showToast('✅ 产品已删除');
      switchTab('manage');
    } catch (err) {
      showToast('❌ 删除失败: ' + err.message);
    } finally {
      btn.disabled = false;
      btn.textContent = '💾 保存修改';
    }
  }

  function showToast(msg) {
    const t = document.getElementById('toast');
    t.textContent = msg;
    t.classList.add('show');
    setTimeout(() => t.classList.remove('show'), 2500);
  }

  // 页面加载时检查登录状态
  checkAuth();
</script>
</body>
</html>
