<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绒颜 · 后台管理</title>
<link rel="icon" href="https://raw.githubusercontent.com/yangruan1688/yangruan.github.io/main/logo.jpg" type="image/jpeg">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #b8860b; --primary-light: #d4a843;
  --bg: #faf8f5; --card-bg: #fff; --text: #2c2c2c;
  --text-light: #999; --danger: #e74c3c; --success: #27ae60;
  --shadow: 0 2px 12px rgba(0,0,0,0.06); --radius: 12px;
}
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', sans-serif;
  background: var(--bg); color: var(--text); min-height: 100vh;
  -webkit-font-smoothing: antialiased;
}
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 18px; color: var(--primary); letter-spacing: 4px; font-weight: 600; }
.header a { color: var(--text); text-decoration: none; font-size: 13px; padding: 5px 10px; border-radius: 18px; transition: all 0.25s; }
.header a:hover { background: rgba(184,134,11,0.1); color: var(--primary); }

.container { max-width: 900px; margin: 0 auto; padding: 20px 16px 80px; }

/* Login Panel */
.login-panel {
  background: var(--card-bg); border-radius: var(--radius); padding: 40px 30px;
  box-shadow: var(--shadow); text-align: center; max-width: 480px; margin: 60px auto;
}
.login-panel h2 { font-size: 20px; margin-bottom: 8px; color: var(--primary); }
.login-panel p { font-size: 13px; color: var(--text-light); margin-bottom: 24px; line-height: 1.6; }
.login-panel input {
  width: 100%; padding: 12px 16px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 14px; margin-bottom: 16px; outline: none; transition: border-color 0.25s;
}
.login-panel input:focus { border-color: var(--primary); }
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  padding: 10px 24px; border: none; border-radius: 24px; font-size: 14px;
  font-weight: 600; cursor: pointer; transition: all 0.25s; text-decoration: none;
}
.btn-primary { background: var(--primary); color: #fff; }
.btn-primary:hover { background: var(--primary-light); }
.btn-danger { background: var(--danger); color: #fff; }
.btn-danger:hover { opacity: 0.85; }
.btn-success { background: var(--success); color: #fff; }
.btn-sm { padding: 6px 14px; font-size: 12px; border-radius: 16px; }
.btn:disabled { opacity: 0.5; cursor: not-allowed; }

/* Admin Dashboard */
.dashboard { display: none; }
.dashboard.active { display: block; }
.toolbar {
  display: flex; justify-content: space-between; align-items: center;
  margin-bottom: 20px; flex-wrap: wrap; gap: 10px;
}
.product-list { display: grid; gap: 12px; }
.product-item {
  background: var(--card-bg); border-radius: var(--radius); padding: 16px;
  box-shadow: var(--shadow); display: flex; gap: 14px; align-items: center;
}
.product-item img {
  width: 72px; height: 72px; border-radius: 8px; object-fit: cover;
  background: #f0ece6; flex-shrink: 0;
}
.product-item .info { flex: 1; min-width: 0; }
.product-item .name { font-size: 15px; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.product-item .meta { font-size: 12px; color: var(--text-light); }
.product-item .actions { display: flex; gap: 8px; flex-shrink: 0; }

/* Modal */
.modal-overlay {
  display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.4);
  z-index: 200; align-items: center; justify-content: center; padding: 16px;
}
.modal-overlay.active { display: flex; }
.modal {
  background: var(--card-bg); border-radius: var(--radius); padding: 28px 24px;
  width: 100%; max-width: 560px; max-height: 90vh; overflow-y: auto;
  box-shadow: 0 20px 60px rgba(0,0,0,0.15);
}
.modal h3 { font-size: 18px; margin-bottom: 20px; color: var(--primary); }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; color: #555; }
.form-group input, .form-group textarea, .form-group select {
  width: 100%; padding: 10px 14px; border: 1px solid #ddd; border-radius: 8px;
  font-size: 14px; outline: none; transition: border-color 0.25s; font-family: inherit;
}
.form-group input:focus, .form-group textarea:focus { border-color: var(--primary); }
.form-group textarea { resize: vertical; min-height: 80px; }
.image-upload-area {
  border: 2px dashed #ddd; border-radius: 8px; padding: 20px; text-align: center;
  cursor: pointer; transition: all 0.25s; color: var(--text-light); font-size: 13px;
}
.image-upload-area:hover { border-color: var(--primary); color: var(--primary); }
.image-preview-list { display: flex; gap: 8px; flex-wrap: wrap; margin-top: 10px; }
.image-preview-item {
  position: relative; width: 72px; height: 72px; border-radius: 8px; overflow: hidden;
}
.image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
.image-preview-item .remove-img {
  position: absolute; top: 2px; right: 2px; width: 20px; height: 20px;
  background: rgba(0,0,0,0.6); color: #fff; border: none; border-radius: 50%;
  font-size: 12px; cursor: pointer; display: flex; align-items: center; justify-content: center;
}
.modal-actions { display: flex; gap: 10px; justify-content: flex-end; margin-top: 24px; }

.toast {
  position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%);
  padding: 12px 28px; border-radius: 24px; color: #fff; font-size: 14px;
  font-weight: 500; z-index: 300; opacity: 0; transition: opacity 0.3s;
  pointer-events: none; white-space: nowrap;
}
.toast.show { opacity: 1; }
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }

.loading-spinner {
  width: 24px; height: 24px; border: 3px solid #eee;
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 40px auto;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<header class="header">
  <h1>✦ 绒颜 ✦ 管理</h1>
  <nav>
    <a href="index.html" target="_blank">查看产品</a>
    <a href="#" id="logoutBtn" style="display:none;">退出登录</a>
  </nav>
</header>

<div class="container">
  <!-- 登录面板 -->
  <div class="login-panel" id="loginPanel">
    <h2>🔐 管理员验证</h2>
    <p>请输入 GitHub Personal Access Token<br>Token 仅保存在当前会话中，关闭页面即自动清除<br><small style="color:#e74c3c;">⚠️ 请勿在公共设备上保存 Token</small></p>
    <input type="password" id="tokenInput" placeholder="ghp_xxxxxxxxxxxxxxxxxxxx" autocomplete="off">
    <button class="btn btn-primary" id="loginBtn">验证并进入</button>
    <p style="margin-top:16px;font-size:11px;color:#bbb;">
      需要 <b>repo</b> 和 <b>issues: write</b> 权限<br>
      <a href="https://github.com/settings/tokens?type=beta" target="_blank" style="color:var(--primary);">前往生成 Fine-grained Token →</a>
    </p>
  </div>

  <!-- 管理面板 -->
  <div class="dashboard" id="dashboard">
    <div class="toolbar">
      <h2 style="font-size:18px;">产品列表</h2>
      <button class="btn btn-primary" id="addProductBtn">＋ 新增产品</button>
    </div>
    <div id="productList">
      <div class="loading-spinner"></div>
    </div>
  </div>
</div>

<!-- 编辑弹窗 -->
<div class="modal-overlay" id="editModal">
  <div class="modal">
    <h3 id="modalTitle">新增产品</h3>
    <input type="hidden" id="editId">
    <div class="form-group">
      <label>产品名称 *</label>
      <input type="text" id="editName" placeholder="例：珍珠蝴蝶结发夹">
    </div>
    <div class="form-group">
      <label>价格 (¥) *</label>
      <input type="number" id="editPrice" step="0.1" min="0" placeholder="29.9">
    </div>
    <div class="form-group">
      <label>分类 *</label>
      <input type="text" id="editCategory" placeholder="例：发夹 / 发圈 / 发簪" list="categorySuggestions">
      <datalist id="categorySuggestions"></datalist>
    </div>
    <div class="form-group">
      <label>产品描述</label>
      <textarea id="editDesc" placeholder="产品材质、尺寸、工艺等描述..."></textarea>
    </div>
    <div class="form-group">
      <label>产品图片（自动压缩为 WebP）</label>
      <div class="image-upload-area" id="imageUploadArea">
        📷 点击或拖拽上传图片<br><small>支持 JPG/PNG/WebP，建议正方形</small>
      </div>
      <input type="file" id="imageFileInput" accept="image/*" multiple style="display:none;">
      <div class="image-preview-list" id="imagePreviewList"></div>
    </div>
    <div class="modal-actions">
      <button class="btn" style="background:#eee;color:#555;" id="cancelEditBtn">取消</button>
      <button class="btn btn-primary" id="saveProductBtn">保存产品</button>
    </div>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';

  // ========== 配置 ==========
  const GITHUB_OWNER = 'yangruan1688';
  const GITHUB_REPO = 'yangruan.github.io';
  const GITHUB_BRANCH = 'main';
  const SYNC_PATH = 'rongyan/sync.json'; 
  const IMAGES_DIR = 'rongyan/images';
  const WEBP_QUALITY = 0.82;
  const MAX_IMAGE_SIZE = 1200;

  // ========== DOM ==========
  const $ = (sel) => document.querySelector(sel);
  const loginPanel = $('#loginPanel'), dashboard = $('#dashboard');
  const tokenInput = $('#tokenInput'), loginBtn = $('#loginBtn'), logoutBtn = $('#logoutBtn');
  const productList = $('#productList'), addProductBtn = $('#addProductBtn');
  const editModal = $('#editModal'), modalTitle = $('#modalTitle');
  const cancelEditBtn = $('#cancelEditBtn'), saveProductBtn = $('#saveProductBtn');
  const imageUploadArea = $('#imageUploadArea'), imageFileInput = $('#imageFileInput');
  const imagePreviewList = $('#imagePreviewList'), toastEl = $('#toast');

  let token = '', products = [], editingImages = [], isSaving = false;

  // ========== 工具函数 ==========
  function showToast(msg, type = 'success') {
    toastEl.textContent = msg;
    toastEl.className = `toast ${type} show`;
    setTimeout(() => toastEl.classList.remove('show'), 2500);
  }
  function escapeHtml(str) {
    return str == null ? '' : String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }
  function encodeBase64(str) { return btoa(unescape(encodeURIComponent(str))); }

  // ========== Auth ==========
  function getToken() { return sessionStorage.getItem('_ry_admin_token') || ''; }
  function setToken(t) { sessionStorage.setItem('_ry_admin_token', t); token = t; }
  function clearAuth() { sessionStorage.removeItem('_ry_admin_token'); token = ''; location.reload(); }
  
  async function verifyToken(t) {
    try {
      const res = await fetch('https://api.github.com/user', { headers: { Authorization: `Bearer ${t}` } });
      if (!res.ok) return false;
      const user = await res.json();
      return user.login === GITHUB_OWNER;
    } catch { return false; }
  }

  loginBtn.addEventListener('click', async () => {
    const t = tokenInput.value.trim();
    if (!t) return showToast('请输入 Token', 'error');
    loginBtn.disabled = true; loginBtn.textContent = '验证中...';
    const valid = await verifyToken(t);
    loginBtn.disabled = false; loginBtn.textContent = '验证并进入';
    if (!valid) return showToast('Token 无效或用户名不匹配', 'error');
    setToken(t); initDashboard();
  });
  logoutBtn.addEventListener('click', (e) => { e.preventDefault(); clearAuth(); });

  // ========== GitHub API Core ==========
  async function ghApi(endpoint, options = {}) {
    const url = endpoint.startsWith('http') ? endpoint : `https://api.github.com${endpoint}`;
    const res = await fetch(url, {
      ...options,
      headers: {
        Authorization: `Bearer ${token}`,
        Accept: 'application/vnd.github.v3+json',
        'Content-Type': 'application/json',
        ...(options.headers || {})
      }
    });
    if (!res.ok) {
      const err = await res.json().catch(() => ({}));
      throw new Error(err.message || `API Error ${res.status}`);
    }
    return res.json();
  }

  // 确保 Label 存在，不存在则创建（避免更新 Issue 时报错）
  async function ensureLabel(name, color = 'ededed') {
    try {
      await ghApi(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/labels/${encodeURIComponent(name)}`);
    } catch (e) {
      // 404 表示不存在，尝试创建
      try {
        await ghApi(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/labels`, {
          method: 'POST',
          body: JSON.stringify({ name, color })
        });
      } catch (createErr) {
        console.warn(`Failed to create label ${name}:`, createErr);
      }
    }
  }

  // 获取所有 Open 的 Issues (作为产品列表)
  async function fetchAllProducts() {
    const issues = await ghApi(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues?state=open&per_page=100&labels=product`);
    return issues.map(issue => {
      try {
        const data = JSON.parse(issue.body || '{}');
        return {
          id: issue.number,
          name: issue.title,
          category: issue.labels.find(l => l.name.startsWith('cat:'))?.name.replace('cat:', '') || '',
          ...data
        };
      } catch (e) { return null; }
    }).filter(Boolean);
  }

  // 创建或更新 Issue
  async function saveProductToIssue(id, name, category, data) {
    const bodyStr = JSON.stringify(data);
    const catLabel = `cat:${category}`;
    
    // 确保分类 Label 存在
    await ensureLabel(catLabel, 'b8860b');
    await ensureLabel('product', '27ae60');

    const labels = ['product', catLabel];
    
    if (id) {
      return ghApi(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues/${id}`, {
        method: 'PATCH',
        body: JSON.stringify({ title: name, body: bodyStr, labels })
      });
    } else {
      return ghApi(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues`, {
        method: 'POST',
        body: JSON.stringify({ title: name, body: bodyStr, labels })
      });
    }
  }

  // 删除产品 (关闭 Issue)
  async function deleteProductIssue(id) {
    return ghApi(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues/${id}`, {
      method: 'PATCH',
      body: JSON.stringify({ state: 'closed' })
    });
  }

  // 触发 CDN 刷新信标
  async function triggerCDNRefresh() {
    try {
      let sha = null;
      try {
        const file = await ghApi(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${SYNC_PATH}?ref=${GITHUB_BRANCH}`);
        sha = file.sha;
      } catch (e) {} 

      const content = encodeBase64(JSON.stringify({ lastUpdated: new Date().toISOString() }));
      await ghApi(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${SYNC_PATH}`, {
        method: 'PUT',
        body: JSON.stringify({
          message: `chore: sync cdn ${Date.now()}`,
          content,
          sha,
          branch: GITHUB_BRANCH
        })
      });
    } catch (e) {
      console.warn('CDN refresh trigger failed:', e);
    }
  }

  // 图片上传
  async function uploadImageFile(base64Data, fileName) {
    const path = `${IMAGES_DIR}/${fileName}`;
    return ghApi(`/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`, {
      method: 'PUT',
      body: JSON.stringify({
        message: `chore: upload image ${fileName}`,
        content: base64Data.split(',')[1],
        branch: GITHUB_BRANCH
      })
    });
  }

  // 图片压缩
  async function compressToWebP(file) {
    return new Promise((resolve, reject) => {
      const img = new Image();
      img.onload = () => {
        let w = img.width, h = img.height;
        if (w > MAX_IMAGE_SIZE || h > MAX_IMAGE_SIZE) {
          const ratio = Math.min(MAX_IMAGE_SIZE / w, MAX_IMAGE_SIZE / h);
          w = Math.round(w * ratio); h = Math.round(h * ratio);
        }
        const canvas = document.createElement('canvas');
        canvas.width = w; canvas.height = h;
        canvas.getContext('2d').drawImage(img, 0, 0, w, h);
        canvas.toBlob((blob) => {
          if (!blob) return reject(new Error('WebP compression failed'));
          const reader = new FileReader();
          reader.onload = () => resolve(reader.result);
          reader.onerror = reject;
          reader.readAsDataURL(blob);
        }, 'image/webp', WEBP_QUALITY);
      };
      img.onerror = reject;
      img.src = URL.createObjectURL(file);
    });
  }

  // ========== Dashboard Logic ==========
  async function initDashboard() {
    token = getToken();
    if (!token) return;
    loginPanel.style.display = 'none';
    dashboard.classList.add('active');
    logoutBtn.style.display = '';
    await loadProducts();
  }

  async function loadProducts() {
    productList.innerHTML = '<div class="loading-spinner"></div>';
    try {
      products = await fetchAllProducts();
      renderProductList();
    } catch (e) {
      productList.innerHTML = `<p style="color:var(--danger);text-align:center;padding:40px;">加载失败: ${e.message}</p>`;
    }
  }

  function getImageUrl(path) {
    if (!path) return '';
    if (path.startsWith('http')) return path;
    return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/${path}`;
  }

  function renderProductList() {
    if (products.length === 0) {
      productList.innerHTML = '<p style="text-align:center;color:var(--text-light);padding:40px;">暂无产品，点击右上角新增</p>';
      return;
    }
    productList.innerHTML = products.slice().reverse().map(p => `
      <div class="product-item" data-id="${p.id}">
        <img src="${getImageUrl(p.cover)}" alt="" onerror="this.style.background='#f0ece6'">
        <div class="info">
          <div class="name">${escapeHtml(p.name)}</div>
          <div class="meta">¥${Number(p.price).toFixed(1)} · ${escapeHtml(p.category)} · #${p.id}</div>
        </div>
        <div class="actions">
          <button class="btn btn-sm btn-primary edit-btn">编辑</button>
          <button class="btn btn-sm btn-danger delete-btn">删除</button>
        </div>
      </div>
    `).join('');

    productList.querySelectorAll('.edit-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.closest('.product-item').dataset.id);
        openEditModal(products.find(p => p.id === id));
      });
    });
    productList.querySelectorAll('.delete-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        const id = parseInt(btn.closest('.product-item').dataset.id);
        deleteProduct(id);
      });
    });
  }

  function updateCategorySuggestions() {
    const cats = [...new Set(products.map(p => p.category).filter(Boolean))];
    $('#categorySuggestions').innerHTML = cats.map(c => `<option value="${escapeHtml(c)}">`).join('');
  }

  function openEditModal(product = null) {
    editingImages = [];
    updateCategorySuggestions();
    
    if (product) {
      modalTitle.textContent = '编辑产品';
      $('#editId').value = product.id;
      $('#editName').value = product.name;
      $('#editPrice').value = product.price;
      $('#editCategory').value = product.category;
      $('#editDesc').value = product.description || '';
      (product.images || []).forEach(url => {
        editingImages.push({ base64: url, isNew: false });
      });
    } else {
      modalTitle.textContent = '新增产品';
      ['editId','editName','editPrice','editCategory','editDesc'].forEach(id => $(`#${id}`).value = '');
    }
    renderImagePreviews();
    editModal.classList.add('active');
  }

  function closeEditModal() { editModal.classList.remove('active'); editingImages = []; }
  cancelEditBtn.addEventListener('click', closeEditModal);
  editModal.addEventListener('click', (e) => { if (e.target === editModal) closeEditModal(); });
  addProductBtn.addEventListener('click', () => openEditModal());

  imageUploadArea.addEventListener('click', () => imageFileInput.click());
  imageUploadArea.addEventListener('dragover', (e) => { e.preventDefault(); imageUploadArea.style.borderColor = 'var(--primary)'; });
  imageUploadArea.addEventListener('dragleave', () => { imageUploadArea.style.borderColor = '#ddd'; });
  imageUploadArea.addEventListener('drop', (e) => {
    e.preventDefault(); imageUploadArea.style.borderColor = '#ddd'; handleFiles(e.dataTransfer.files);
  });
  imageFileInput.addEventListener('change', () => { handleFiles(imageFileInput.files); imageFileInput.value = ''; });

  async function handleFiles(files) {
    for (const file of files) {
      if (!file.type.startsWith('image/')) continue;
      try {
        editingImages.push({ base64: await compressToWebP(file), isNew: true });
        renderImagePreviews();
      } catch (e) { showToast(`图片压缩失败: ${file.name}`, 'error'); }
    }
  }

  function renderImagePreviews() {
    imagePreviewList.innerHTML = editingImages.map((img, i) => `
      <div class="image-preview-item">
        <img src="${img.base64}" alt="">
        <button class="remove-img" data-index="${i}">×</button>
      </div>
    `).join('');
    imagePreviewList.querySelectorAll('.remove-img').forEach(btn => {
      btn.addEventListener('click', () => { 
        editingImages.splice(parseInt(btn.dataset.index), 1); 
        renderImagePreviews(); 
      });
    });
  }

  // 保存逻辑
  saveProductBtn.addEventListener('click', async () => {
    if (isSaving) return;
    const name = $('#editName').value.trim();
    const price = parseFloat($('#editPrice').value);
    const category = $('#editCategory').value.trim();
    const desc = $('#editDesc').value.trim();
    const existingId = $('#editId').value;

    if (!name) return showToast('请输入产品名称', 'error');
    if (isNaN(price) || price < 0) return showToast('请输入有效价格', 'error');
    if (!category) return showToast('请输入分类', 'error');
    if (editingImages.length === 0) return showToast('请至少上传一张图片', 'error');

    isSaving = true; saveProductBtn.disabled = true; saveProductBtn.textContent = '保存中...';

    try {
      // 1. 上传图片
      const imageUrls = [];
      for (let i = 0; i < editingImages.length; i++) {
        const img = editingImages[i];
        if (img.isNew) {
          const fileName = `${Date.now()}_${i}.webp`;
          await uploadImageFile(img.base64, fileName);
          imageUrls.push(`${IMAGES_DIR}/${fileName}`);
        } else {
          // 兼容旧数据：如果是完整URL则提取路径，否则直接使用
          let path = img.base64;
          if (path.startsWith('http')) {
            path = path.replace(`https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/`, '');
          }
          imageUrls.push(path);
        }
      }

      // 2. 构造数据并保存到 Issue
      const data = {
        price, description: desc,
        cover: getImageUrl(imageUrls[0]),
        images: imageUrls.map(u => getImageUrl(u)),
        updatedAt: new Date().toISOString()
      };
      
      await saveProductToIssue(existingId ? parseInt(existingId) : null, name, category, data);

      // 3. 触发 CDN 刷新
      await triggerCDNRefresh();

      // 4. 通知其他标签页
      localStorage.setItem('_ry_sync_version', Date.now().toString());

      showToast(existingId ? '产品已更新' : '产品已添加');
      closeEditModal();
      await loadProducts();
    } catch (e) {
      showToast(`保存失败: ${e.message}`, 'error');
    } finally {
      isSaving = false; saveProductBtn.disabled = false; saveProductBtn.textContent = '保存产品';
    }
  });

  async function deleteProduct(id) {
    const p = products.find(x => x.id === id);
    if (!p || !confirm(`确定删除「${p.name}」？\n此操作将关闭对应 Issue。`)) return;
    try {
      await deleteProductIssue(id);
      await triggerCDNRefresh();
      localStorage.setItem('_ry_sync_version', Date.now().toString());
      showToast('产品已删除');
      await loadProducts();
    } catch (e) { showToast(`删除失败: ${e.message}`, 'error'); }
  }

  if (getToken()) initDashboard();
})();
</script>
</body>
</html>
