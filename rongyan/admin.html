<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>绒颜 · 管理后台</title>
<link rel="icon" href="../logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #b8860b;
  --primary-light: #d4a843;
  --bg: #faf8f5;
  --card-bg: #ffffff;
  --text: #2c2c2c;
  --text-light: #888;
  --danger: #e74c3c;
  --success: #27ae60;
  --warning: #f39c12;
  --shadow: 0 2px 16px rgba(0,0,0,0.07);
  --radius: 12px;
}
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 9px 18px; border: 1px solid rgba(0,0,0,0.1);
  background: #fff; border-radius: 20px; font-size: 13px;
  color: var(--text); cursor: pointer; transition: all 0.25s;
  white-space: nowrap; font-weight: 500;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-light); border-color: var(--primary-light); color: #fff; }
.btn-danger { color: var(--danger); border-color: rgba(231,76,60,0.3); }
.btn-danger:hover { background: rgba(231,76,60,0.06); border-color: var(--danger); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.login-page {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100vh; padding: 24px;
}
.login-page h1 { font-size: 22px; color: var(--primary); letter-spacing: 4px; margin-bottom: 6px; }
.login-page .sub { color: var(--text-light); font-size: 13px; margin-bottom: 28px; }
.login-box {
  width: 100%; max-width: 380px; background: var(--card-bg);
  padding: 28px 22px; border-radius: var(--radius); box-shadow: var(--shadow);
}
.login-box label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.login-box input {
  width: 100%; padding: 11px 14px; border: 1px solid rgba(0,0,0,0.1);
  border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 14px;
  transition: border-color 0.25s; background: #fafafa;
}
.login-box input:focus { border-color: var(--primary); background: #fff; }
.login-box .hint { font-size: 11px; color: var(--text-light); margin-top: -8px; margin-bottom: 14px; line-height: 1.5; }
.login-box .hint a { color: var(--primary); }
.login-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; text-align: center; }
.admin-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
}
.admin-header h2 { font-size: 15px; color: var(--primary); letter-spacing: 2px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.admin-body { max-width: 800px; margin: 0 auto; padding: 16px 14px; }
.stats-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-card {
  flex: 1; min-width: 80px; background: var(--card-bg);
  border-radius: 10px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow);
}
.stat-card .stat-num { font-size: 22px; font-weight: 700; color: var(--primary); }
.stat-card .stat-label { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.product-list { display: flex; flex-direction: column; gap: 10px; }
.product-item {
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 12px; display: flex;
  gap: 12px; align-items: center; transition: transform 0.2s;
}
.product-item .item-img {
  width: 60px; height: 60px; border-radius: 8px;
  overflow: hidden; flex-shrink: 0; background: #f0ece6;
}
.product-item .item-img img { width: 100%; height: 100%; object-fit: cover; }
.product-item .item-info { flex: 1; min-width: 0; }
.product-item .item-name {
  font-size: 14px; font-weight: 600; margin-bottom: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.product-item .item-meta { font-size: 12px; color: var(--text-light); display: flex; gap: 10px; }
.product-item .item-meta .price { color: var(--primary); font-weight: 600; }
.product-item .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 42px; margin-bottom: 10px; }
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.5); display: flex;
  align-items: flex-end; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.3s;
}
.modal-overlay.show { opacity: 1; visibility: visible; }
.modal-content {
  background: #fff; width: 100%; max-width: 600px; max-height: 92vh;
  border-radius: 16px 16px 0 0; overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
.modal-overlay.show .modal-content { transform: translateY(0); }
@media (min-width: 768px) {
  .modal-overlay { align-items: center; }
  .modal-content { border-radius: 16px; max-height: 85vh; }
}
.modal-header {
  position: sticky; top: 0; background: #fff;
  padding: 14px 18px; border-bottom: 1px solid rgba(0,0,0,0.06);
  display: flex; align-items: center; justify-content: space-between; z-index: 10;
}
.modal-header h3 { font-size: 16px; color: var(--primary); }
.modal-close {
  background: none; border: none; font-size: 22px;
  color: var(--text-light); cursor: pointer; padding: 4px 8px;
  border-radius: 6px; transition: background 0.2s; line-height: 1;
}
.modal-close:hover { background: rgba(0,0,0,0.05); }
.modal-body { padding: 18px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 14px; border: 1px solid rgba(0,0,0,0.1);
  border-radius: 8px; font-size: 14px; outline: none;
  transition: border-color 0.25s; font-family: inherit; background: #fff;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
.form-group textarea { resize: vertical; min-height: 72px; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.modal-footer {
  position: sticky; bottom: 0; background: #fff;
  padding: 12px 18px; border-top: 1px solid rgba(0,0,0,0.06);
  display: flex; gap: 10px; justify-content: flex-end;
}
.upload-area {
  border: 2px dashed rgba(0,0,0,0.12); border-radius: 10px;
  padding: 18px; text-align: center; cursor: pointer;
  transition: all 0.25s; position: relative;
}
.upload-area:hover { border-color: var(--primary); background: rgba(184,134,11,0.03); }
.upload-area.dragover { border-color: var(--primary); background: rgba(184,134,11,0.08); box-shadow: 0 0 0 4px rgba(184,134,11,0.12); }
.upload-area .upload-icon { font-size: 28px; margin-bottom: 6px; }
.upload-area p { font-size: 12px; color: var(--text-light); }
.upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.image-preview-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.image-preview-item {
  position: relative; width: 72px; height: 72px;
  border-radius: 8px; overflow: hidden; border: 2px solid transparent;
}
.image-preview-item.is-cover { border-color: var(--primary); }
.image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
.image-preview-item .cover-badge {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: var(--primary); color: #fff; font-size: 9px; text-align: center; padding: 2px;
}
.image-preview-item .img-actions {
  position: absolute; top: 0; right: 0; display: flex; flex-direction: column; gap: 2px;
}
.image-preview-item .img-btn {
  width: 20px; height: 20px; border-radius: 0 0 0 6px;
  background: rgba(0,0,0,0.6); color: #fff; border: none;
  font-size: 10px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; line-height: 1;
}
.image-preview-item .img-btn.set-cover { border-radius: 0 0 6px 0; }
.upload-progress { display: none; margin-top: 10px; }
.upload-progress.show { display: block; }
.progress-bar { height: 4px; background: #eee; border-radius: 2px; overflow: hidden; }
.progress-bar .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; width: 0%; }
.progress-text { font-size: 11px; color: var(--text-light); margin-top: 4px; text-align: center; }
.save-progress { display: none; margin-top: 12px; }
.save-progress.show { display: block; }
.toast-container {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
}
.toast {
  padding: 10px 20px; border-radius: 8px; font-size: 13px;
  color: #fff; pointer-events: auto;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary); }
.toast.warning { background: var(--warning); }
@keyframes toastIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; } }
.confirm-overlay {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,0.5); display: flex;
  align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.3s;
}
.confirm-overlay.show { opacity: 1; visibility: visible; }
.confirm-box {
  background: #fff; border-radius: 14px;
  padding: 24px 20px 18px; max-width: 300px; width: 88%; text-align: center;
}
.confirm-box p { font-size: 14px; margin-bottom: 18px; line-height: 1.5; white-space: pre-line; }
.confirm-box .confirm-actions { display: flex; gap: 10px; justify-content: center; }
.token-warning {
  background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
  padding: 8px 14px; margin-bottom: 12px; font-size: 12px; color: #856404;
  display: flex; align-items: center; gap: 8px;
}
.token-warning .warn-icon { font-size: 16px; }
.spinner {
  width: 28px; height: 28px; border: 3px solid #eee;
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-page" id="loginPage">
  <h1>✦ 绒颜 ✦</h1>
  <p class="sub">产品管理后台</p>
  <div class="login-box">
    <label>GitHub Token</label>
    <input type="password" id="tokenInput" placeholder="粘贴 Fine-grained PAT（github_pat_xxx...）" autocomplete="off">
    <p class="hint">
      使用 <a href="https://github.com/settings/tokens?type=beta" target="_blank">Fine-grained Token</a>，
      仅授权本仓库 Contents 读写权限，建议有效期 30 天。<br>
      Token 仅保存在当前浏览器会话中，关闭页面即失效。
    </p>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" id="loginBtn">登 录</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="adminPanel" style="display:none">
  <div class="admin-header">
    <h2>✦ 绒颜管理</h2>
    <div class="header-actions">
      <button class="btn btn-primary btn-sm" id="addBtn">＋ 添加</button>
      <button class="btn btn-sm" id="refreshBtn">↻ 刷新</button>
      <button class="btn btn-sm btn-danger" id="logoutBtn">退出</button>
    </div>
  </div>
  <div class="admin-body">
    <div class="token-warning" id="tokenWarning" style="display:none">
      <span class="warn-icon">⚠️</span>
      <span id="tokenWarningText"></span>
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="product-list" id="productList"></div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">添加产品</h3>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>产品名称</label>
          <input type="text" id="fName" placeholder="如：珍珠花朵发夹">
        </div>
        <div class="form-group" style="max-width:120px">
          <label>价格（¥）</label>
          <input type="number" id="fPrice" placeholder="0.0" step="0.1" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>分类</label>
        <select id="fCategory">
          <option value="发饰">发饰</option>
          <option value="耳饰">耳饰</option>
          <option value="胸饰">胸饰</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>产品描述</label>
        <textarea id="fDesc" placeholder="描述产品的特点、材质、适用场景等..."></textarea>
      </div>
      <div class="form-group">
        <label>产品图片（自动压缩为 webp）</label>
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">📷</div>
          <p>点击选择或拖拽图片到此处<br>支持 jpg / png / webp，可多选</p>
          <input type="file" id="fileInput" accept="image/*" multiple>
        </div>
        <div class="upload-progress" id="uploadProgress">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text"
