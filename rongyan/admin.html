<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex, nofollow">
<title>绒颜 · 管理后台</title>
<link rel="icon" href="../logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #b8860b;
  --primary-light: #d4a843;
  --bg: #faf8f5;
  --card-bg: #ffffff;
  --text: #2c2c2c;
  --text-light: #888;
  --danger: #e74c3c;
  --success: #27ae60;
  --warning: #f39c12;
  --shadow: 0 2px 16px rgba(0,0,0,0.07);
  --radius: 12px;
}
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
.btn {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 9px 18px; border: 1px solid rgba(0,0,0,0.1);
  background: #fff; border-radius: 20px; font-size: 13px;
  color: var(--text); cursor: pointer; transition: all 0.25s;
  white-space: nowrap; font-weight: 500;
}
.btn:hover { border-color: var(--primary); color: var(--primary); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; }
.btn-primary { background: var(--primary); color: #fff; border-color: var(--primary); }
.btn-primary:hover { background: var(--primary-light); border-color: var(--primary-light); color: #fff; }
.btn-danger { color: var(--danger); border-color: rgba(231,76,60,0.3); }
.btn-danger:hover { background: rgba(231,76,60,0.06); border-color: var(--danger); }
.btn-sm { padding: 6px 12px; font-size: 12px; }
.login-page {
  display: flex; flex-direction: column; align-items: center;
  justify-content: center; min-height: 100vh; padding: 24px;
}
.login-page h1 { font-size: 22px; color: var(--primary); letter-spacing: 4px; margin-bottom: 6px; }
.login-page .sub { color: var(--text-light); font-size: 13px; margin-bottom: 28px; }
.login-box {
  width: 100%; max-width: 380px; background: var(--card-bg);
  padding: 28px 22px; border-radius: var(--radius); box-shadow: var(--shadow);
}
.login-box label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
.login-box input {
  width: 100%; padding: 11px 14px; border: 1px solid rgba(0,0,0,0.1);
  border-radius: 8px; font-size: 14px; outline: none; margin-bottom: 14px;
  transition: border-color 0.25s; background: #fafafa;
}
.login-box input:focus { border-color: var(--primary); background: #fff; }
.login-box .hint { font-size: 11px; color: var(--text-light); margin-top: -8px; margin-bottom: 14px; line-height: 1.5; }
.login-box .hint a { color: var(--primary); }
.login-error { color: var(--danger); font-size: 13px; margin-top: 8px; display: none; text-align: center; }
.admin-header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  padding: 10px 14px; display: flex; align-items: center; justify-content: space-between;
}
.admin-header h2 { font-size: 15px; color: var(--primary); letter-spacing: 2px; }
.header-actions { display: flex; gap: 8px; align-items: center; }
.admin-body { max-width: 800px; margin: 0 auto; padding: 16px 14px; }
.stats-bar { display: flex; gap: 10px; margin-bottom: 16px; flex-wrap: wrap; }
.stat-card {
  flex: 1; min-width: 80px; background: var(--card-bg);
  border-radius: 10px; padding: 12px 8px; text-align: center; box-shadow: var(--shadow);
}
.stat-card .stat-num { font-size: 22px; font-weight: 700; color: var(--primary); }
.stat-card .stat-label { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.product-list { display: flex; flex-direction: column; gap: 10px; }
.product-item {
  background: var(--card-bg); border-radius: var(--radius);
  box-shadow: var(--shadow); padding: 12px; display: flex;
  gap: 12px; align-items: center; transition: transform 0.2s;
}
.product-item .item-img {
  width: 60px; height: 60px; border-radius: 8px;
  overflow: hidden; flex-shrink: 0; background: #f0ece6;
}
.product-item .item-img img { width: 100%; height: 100%; object-fit: cover; }
.product-item .item-info { flex: 1; min-width: 0; }
.product-item .item-name {
  font-size: 14px; font-weight: 600; margin-bottom: 3px;
  overflow: hidden; text-overflow: ellipsis; white-space: nowrap;
}
.product-item .item-meta { font-size: 12px; color: var(--text-light); display: flex; gap: 10px; }
.product-item .item-meta .price { color: var(--primary); font-weight: 600; }
.product-item .item-actions { display: flex; gap: 6px; flex-shrink: 0; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 42px; margin-bottom: 10px; }
.modal-overlay {
  position: fixed; inset: 0; z-index: 2000;
  background: rgba(0,0,0,0.5); display: flex;
  align-items: flex-end; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.3s;
}
.modal-overlay.show { opacity: 1; visibility: visible; }
.modal-content {
  background: #fff; width: 100%; max-width: 600px; max-height: 92vh;
  border-radius: 16px 16px 0 0; overflow-y: auto;
  transform: translateY(100%);
  transition: transform 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
  padding-bottom: env(safe-area-inset-bottom, 20px);
}
.modal-overlay.show .modal-content { transform: translateY(0); }
@media (min-width: 768px) {
  .modal-overlay { align-items: center; }
  .modal-content { border-radius: 16px; max-height: 85vh; }
}
.modal-header {
  position: sticky; top: 0; background: #fff;
  padding: 14px 18px; border-bottom: 1px solid rgba(0,0,0,0.06);
  display: flex; align-items: center; justify-content: space-between; z-index: 10;
}
.modal-header h3 { font-size: 16px; color: var(--primary); }
.modal-close {
  background: none; border: none; font-size: 22px;
  color: var(--text-light); cursor: pointer; padding: 4px 8px;
  border-radius: 6px; transition: background 0.2s; line-height: 1;
}
.modal-close:hover { background: rgba(0,0,0,0.05); }
.modal-body { padding: 18px; }
.form-group { margin-bottom: 16px; }
.form-group label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 5px; }
.form-group input, .form-group select, .form-group textarea {
  width: 100%; padding: 10px 14px; border: 1px solid rgba(0,0,0,0.1);
  border-radius: 8px; font-size: 14px; outline: none;
  transition: border-color 0.25s; font-family: inherit; background: #fff;
}
.form-group input:focus, .form-group select:focus, .form-group textarea:focus { border-color: var(--primary); }
.form-group textarea { resize: vertical; min-height: 72px; }
.form-row { display: flex; gap: 12px; }
.form-row .form-group { flex: 1; }
.modal-footer {
  position: sticky; bottom: 0; background: #fff;
  padding: 12px 18px; border-top: 1px solid rgba(0,0,0,0.06);
  display: flex; gap: 10px; justify-content: flex-end;
}
.upload-area {
  border: 2px dashed rgba(0,0,0,0.12); border-radius: 10px;
  padding: 18px; text-align: center; cursor: pointer;
  transition: all 0.25s; position: relative;
}
.upload-area:hover { border-color: var(--primary); background: rgba(184,134,11,0.03); }
.upload-area.dragover { border-color: var(--primary); background: rgba(184,134,11,0.08); box-shadow: 0 0 0 4px rgba(184,134,11,0.12); }
.upload-area .upload-icon { font-size: 28px; margin-bottom: 6px; }
.upload-area p { font-size: 12px; color: var(--text-light); }
.upload-area input[type=file] { position: absolute; inset: 0; opacity: 0; cursor: pointer; }
.image-preview-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
.image-preview-item {
  position: relative; width: 72px; height: 72px;
  border-radius: 8px; overflow: hidden; border: 2px solid transparent;
}
.image-preview-item.is-cover { border-color: var(--primary); }
.image-preview-item img { width: 100%; height: 100%; object-fit: cover; }
.image-preview-item .cover-badge {
  position: absolute; bottom: 0; left: 0; right: 0;
  background: var(--primary); color: #fff; font-size: 9px; text-align: center; padding: 2px;
}
.image-preview-item .img-actions {
  position: absolute; top: 0; right: 0; display: flex; flex-direction: column; gap: 2px;
}
.image-preview-item .img-btn {
  width: 20px; height: 20px; border-radius: 0 0 0 6px;
  background: rgba(0,0,0,0.6); color: #fff; border: none;
  font-size: 10px; cursor: pointer; display: flex;
  align-items: center; justify-content: center; line-height: 1;
}
.image-preview-item .img-btn.set-cover { border-radius: 0 0 6px 0; }
.upload-progress { display: none; margin-top: 10px; }
.upload-progress.show { display: block; }
.progress-bar { height: 4px; background: #eee; border-radius: 2px; overflow: hidden; }
.progress-bar .progress-fill { height: 100%; background: var(--primary); transition: width 0.3s; width: 0%; }
.progress-text { font-size: 11px; color: var(--text-light); margin-top: 4px; text-align: center; }
.save-progress { display: none; margin-top: 12px; }
.save-progress.show { display: block; }
.toast-container {
  position: fixed; top: 16px; left: 50%; transform: translateX(-50%);
  z-index: 9999; display: flex; flex-direction: column; gap: 6px; pointer-events: none;
}
.toast {
  padding: 10px 20px; border-radius: 8px; font-size: 13px;
  color: #fff; pointer-events: auto;
  animation: toastIn 0.3s ease, toastOut 0.3s ease 2.7s forwards;
  white-space: nowrap; box-shadow: 0 4px 16px rgba(0,0,0,0.15);
}
.toast.success { background: var(--success); }
.toast.error { background: var(--danger); }
.toast.info { background: var(--primary); }
.toast.warning { background: var(--warning); }
@keyframes toastIn { from { opacity:0; transform:translateY(-10px); } to { opacity:1; transform:translateY(0); } }
@keyframes toastOut { from { opacity:1; } to { opacity:0; } }
.confirm-overlay {
  position: fixed; inset: 0; z-index: 3000;
  background: rgba(0,0,0,0.5); display: flex;
  align-items: center; justify-content: center;
  opacity: 0; visibility: hidden; transition: all 0.3s;
}
.confirm-overlay.show { opacity: 1; visibility: visible; }
.confirm-box {
  background: #fff; border-radius: 14px;
  padding: 24px 20px 18px; max-width: 300px; width: 88%; text-align: center;
}
.confirm-box p { font-size: 14px; margin-bottom: 18px; line-height: 1.5; white-space: pre-line; }
.confirm-box .confirm-actions { display: flex; gap: 10px; justify-content: center; }
.token-warning {
  background: #fff3cd; border: 1px solid #ffc107; border-radius: 8px;
  padding: 8px 14px; margin-bottom: 12px; font-size: 12px; color: #856404;
  display: flex; align-items: center; gap: 8px;
}
.token-warning .warn-icon { font-size: 16px; }
.spinner {
  width: 28px; height: 28px; border: 3px solid #eee;
  border-top-color: var(--primary); border-radius: 50%;
  animation: spin 0.8s linear infinite; margin: 0 auto 10px;
}
@keyframes spin { to { transform: rotate(360deg); } }
</style>
</head>
<body>

<div class="login-page" id="loginPage">
  <h1>✦ 绒颜 ✦</h1>
  <p class="sub">产品管理后台</p>
  <div class="login-box">
    <label>GitHub Token</label>
    <input type="password" id="tokenInput" placeholder="粘贴 Fine-grained PAT（github_pat_xxx...）" autocomplete="off">
    <p class="hint">
      使用 <a href="https://github.com/settings/tokens?type=beta" target="_blank">Fine-grained Token</a>，
      仅授权本仓库 Contents 读写权限，建议有效期 30 天。<br>
      Token 仅保存在当前浏览器会话中，关闭页面即失效。
    </p>
    <button class="btn btn-primary" style="width:100%;justify-content:center;" id="loginBtn">登 录</button>
    <div class="login-error" id="loginError"></div>
  </div>
</div>

<div id="adminPanel" style="display:none">
  <div class="admin-header">
    <h2>✦ 绒颜管理</h2>
    <div class="header-actions">
      <button class="btn btn-primary btn-sm" id="addBtn">＋ 添加</button>
      <button class="btn btn-sm" id="refreshBtn">↻ 刷新</button>
      <button class="btn btn-sm btn-danger" id="logoutBtn">退出</button>
    </div>
  </div>
  <div class="admin-body">
    <div class="token-warning" id="tokenWarning" style="display:none">
      <span class="warn-icon">⚠️</span>
      <span id="tokenWarningText"></span>
    </div>
    <div class="stats-bar" id="statsBar"></div>
    <div class="product-list" id="productList"></div>
  </div>
</div>

<div class="modal-overlay" id="editModal">
  <div class="modal-content">
    <div class="modal-header">
      <h3 id="modalTitle">添加产品</h3>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body">
      <div class="form-row">
        <div class="form-group">
          <label>产品名称</label>
          <input type="text" id="fName" placeholder="如：珍珠花朵发夹">
        </div>
        <div class="form-group" style="max-width:120px">
          <label>价格（¥）</label>
          <input type="number" id="fPrice" placeholder="0.0" step="0.1" min="0">
        </div>
      </div>
      <div class="form-group">
        <label>分类</label>
        <select id="fCategory">
          <option value="发饰">发饰</option>
          <option value="耳饰">耳饰</option>
          <option value="胸饰">胸饰</option>
          <option value="其他">其他</option>
        </select>
      </div>
      <div class="form-group">
        <label>产品描述</label>
        <textarea id="fDesc" placeholder="描述产品的特点、材质、适用场景等..."></textarea>
      </div>
      <div class="form-group">
        <label>产品图片（自动压缩为 webp）</label>
        <div class="upload-area" id="uploadArea">
          <div class="upload-icon">📷</div>
          <p>点击选择或拖拽图片到此处<br>支持 jpg / png / webp，可多选</p>
          <input type="file" id="fileInput" accept="image/*" multiple>
        </div>
        <div class="upload-progress" id="uploadProgress">
          <div class="progress-bar"><div class="progress-fill" id="progressFill"></div></div>
          <div class="progress-text" id="progressText">处理中...</div>
        </div>
        <div class="image-preview-list" id="imagePreviewList"></div>
      </div>
      <div class="save-progress" id="saveProgress">
        <div class="progress-bar"><div class="progress-fill" id="saveProgressFill"></div></div>
        <div class="progress-text" id="saveProgressText">保存中...</div>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn" id="cancelBtn">取消</button>
      <button class="btn btn-primary" id="saveBtn">保存</button>
    </div>
  </div>
</div>

<div class="confirm-overlay" id="confirmOverlay">
  <div class="confirm-box">
    <p id="confirmMsg">确定删除？</p>
    <div class="confirm-actions">
      <button class="btn" id="confirmNo">取消</button>
      <button class="btn btn-danger" id="confirmYes">确定</button>
    </div>
  </div>
</div>

<div class="toast-container" id="toastContainer"></div>

<script>
(function () {
  'use strict';

  const GITHUB_OWNER = 'yangruan1688';
  const GITHUB_REPO  = 'yangruan.github.io';
  const GITHUB_BRANCH = 'main';
  const PRODUCTS_PATH = 'rongyan/products.json';
  const IMAGES_PATH   = 'rongyan/images';
  const API_BASE = 'https://api.github.com';
  const MAX_FILE_SIZE_MB = 10;

  let TOKEN = '';
  let products = [];
  let editingId = null;
  let tempImages = [];
  let originalImages = [];
  let hasUnsavedChanges = false;

  const $ = id => document.getElementById(id);
  const loginPage = $('loginPage');
  const adminPanel = $('adminPanel');
  const tokenInput = $('tokenInput');
  const loginBtn = $('loginBtn');
  const loginError = $('loginError');
  const addBtn = $('addBtn');
  const refreshBtn = $('refreshBtn');
  const logoutBtn = $('logoutBtn');
  const statsBar = $('statsBar');
  const productList = $('productList');
  const editModal = $('editModal');
  const modalTitle = $('modalTitle');
  const modalClose = $('modalClose');
  const cancelBtn = $('cancelBtn');
  const saveBtn = $('saveBtn');
  const fileInput = $('fileInput');
  const uploadArea = $('uploadArea');
  const uploadProgress = $('uploadProgress');
  const progressFill = $('progressFill');
  const progressText = $('progressText');
  const imagePreviewList = $('imagePreviewList');
  const confirmOverlay = $('confirmOverlay');
  const confirmMsg = $('confirmMsg');
  const confirmYes = $('confirmYes');
  const confirmNo = $('confirmNo');
  const saveProgress = $('saveProgress');
  const saveProgressFill = $('saveProgressFill');
  const saveProgressText = $('saveProgressText');
  const tokenWarning = $('tokenWarning');
  const tokenWarningText = $('tokenWarningText');

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str)
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;')
      .replace(/'/g, '&#39;')
      .replace(/`/g, '&#96;');
  }

  function encodeToBase64(str) {
    const bytes = new TextEncoder().encode(str);
    const binStr = Array.from(bytes, b => String.fromCodePoint(b)).join('');
    return btoa(binStr);
  }

  function decodeFileContent(content) {
    const cleaned = content.replace(/\n/g, '');
    const binary = atob(cleaned);
    const bytes = new Uint8Array(binary.length);
    for (let i = 0; i < binary.length; i++) {
      bytes[i] = binary.charCodeAt(i);
    }
    return new TextDecoder('utf-8').decode(bytes);
  }

  function toast(msg, type = 'info') {
    const el = document.createElement('div');
    el.className = 'toast ' + type;
    el.textContent = msg;
    $('toastContainer').appendChild(el);
    setTimeout(() => el.remove(), 3200);
  }

  function showConfirm(msg) {
    return new Promise(resolve => {
      confirmMsg.textContent = msg;
      confirmOverlay.classList.add('show');
      const yes = () => { cleanup(); resolve(true); };
      const no  = () => { cleanup(); resolve(false); };
      function cleanup() {
        confirmOverlay.classList.remove('show');
        confirmYes.removeEventListener('click', yes);
        confirmNo.removeEventListener('click', no);
      }
      confirmYes.addEventListener('click', yes);
      confirmNo.addEventListener('click', no);
    });
  }

  const headers = () => ({
    'Authorization': `Bearer ${TOKEN}`,
    'Accept': 'application/vnd.github.v3+json',
    'X-GitHub-Api-Version': '2022-11-28'
  });

  async function getFile(path) {
    const res = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}?ref=${GITHUB_BRANCH}`, {
      headers: headers()
    });
    if (res.status === 404) return null;
    if (!res.ok) throw new Error(`API 错误: ${res.status}`);
    return await res.json();
  }

  async function putFile(path, content, message, sha) {
    const body = {
      message, content, branch: GITHUB_BRANCH
    };
    if (sha) body.sha = sha;
    const res = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`, {
      method: 'PUT', headers: headers(),
      body: JSON.stringify(body)
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.message || '上传失败');
    }
    return await res.json();
  }

  async function deleteFile(path, sha) {
    const res = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${path}`, {
      method: 'DELETE', headers: headers(),
      body: JSON.stringify({ message: `delete: ${path}`, branch: GITHUB_BRANCH, sha })
    });
    if (!res.ok) throw new Error('删除失败');
    return await res.json();
  }

  async function purgeCDN() {
    const purgeUrl = `https://purge.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/${PRODUCTS_PATH}`;
    try {
      const res = await fetch(purgeUrl);
      if (res.ok) {
        console.log('CDN 缓存已刷新');
      } else {
        console.warn('CDN 缓存刷新返回状态:', res.status);
      }
    } catch (e) {
      console.warn('CDN 缓存刷新失败:', e.message);
    }
  }

  function compressImage(file, maxWidth = 1200, quality = 0.82) {
    return new Promise((resolve, reject) => {
      const reader = new FileReader();
      reader.onload = (e) => {
        const img = new Image();
        img.onload = () => {
          let w = img.width, h = img.height;
          if (w > maxWidth) { h = Math.round(h * maxWidth / w); w = maxWidth; }
          const canvas = document.createElement('canvas');
          canvas.width = w; canvas.height = h;
          const ctx = canvas.getContext('2d');
          ctx.drawImage(img, 0, 0, w, h);
          canvas.toBlob(blob => {
            if (!blob) return reject(new Error('压缩失败'));
            const reader2 = new FileReader();
            reader2.onload = () => {
              const base64 = reader2.result.split(',')[1];
              resolve({ base64, width: w, height: h, size: blob.size });
            };
            reader2.onerror = () => reject(new Error('读取压缩结果失败'));
            reader2.readAsDataURL(blob);
          }, 'image/webp', quality);
        };
        img.onerror = () => reject(new Error('图片加载失败，可能不是有效的图片文件'));
        img.src = e.target.result;
      };
      reader.onerror = () => reject(new Error('文件读取失败'));
      reader.readAsDataURL(file);
    });
  }

  async function checkTokenExpiration() {
    try {
      const res = await fetch(`${API_BASE}/user`, { headers: headers() });

      if (res.status === 401) {
        tokenWarningText.textContent = 'Token 已失效，请重新生成';
        tokenWarning.style.display = 'flex';
        tokenWarning.style.background = '#f8d7da';
        tokenWarning.style.borderColor = '#f5c6cb';
        tokenWarning.style.color = '#721c24';
        return;
      }

      const remaining = res.headers.get('x-ratelimit-remaining');

      if (remaining !== null && parseInt(remaining) < 100) {
        toast(`API 配额剩余 ${remaining} 次，请注意节约使用`, 'warning');
      }

      const loginTime = safeSessionGet('_ry_login_time');
      if (loginTime) {
        const elapsed = Date.now() - parseInt(loginTime);
        const daysElapsed = Math.floor(elapsed / (1000 * 60 * 60 * 24));
        const daysLeft = 30 - daysElapsed;

        if (daysLeft <= 0) {
          tokenWarningText.textContent = 'Token 可能已过期（登录已超过 30 天），如操作失败请重新生成';
          tokenWarning.style.display = 'flex';
          tokenWarning.style.background = '#f8d7da';
          tokenWarning.style.borderColor = '#f5c6cb';
          tokenWarning.style.color = '#721c24';
        } else if (daysLeft <= 7) {
          tokenWarningText.textContent = `Token 可能在 ${daysLeft} 天后过期，建议提前更新`;
          tokenWarning.style.display = 'flex';
        } else {
          tokenWarning.style.display = 'none';
        }
      }
    } catch (e) {
      console.warn('Token 检测失败:', e.message);
    }
  }

  function safeSessionSet(key, value) {
    try { sessionStorage.setItem(key, value); } catch (e) { }
  }
  function safeSessionGet(key) {
    try { return sessionStorage.getItem(key); } catch (e) { return null; }
  }
  function safeSessionRemove(key) {
    try { sessionStorage.removeItem(key); } catch (e) { }
  }

  async function doLogin() {
    const token = tokenInput.value.trim();
    if (!token) { showLoginError('请输入 Token'); return; }

    loginBtn.disabled = true;
    loginBtn.textContent = '验证中...';
    showLoginError('');

    try {
      TOKEN = token;
      const res = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}`, { headers: headers() });
      if (!res.ok) throw new Error(res.status === 401 ? 'Token 无效或已过期' : '连接失败');

      const permRes = await fetch(`${API_BASE}/repos/${GITHUB_OWNER}/${GITHUB_REPO}/contents/${PRODUCTS_PATH}?ref=${GITHUB_BRANCH}`, {
        headers: headers()
      });
      if (permRes.status === 403) throw new Error('Token 没有仓库 Contents 权限');

      safeSessionSet('_ry_token', token);
      safeSessionSet('_ry_login_time', String(Date.now()));
      showAdmin();
    } catch (err) {
      showLoginError(err.message || '登录失败');
      TOKEN = '';
    } finally {
      loginBtn.disabled = false;
      loginBtn.textContent = '登 录';
    }
  }

  function showLoginError(msg) {
    loginError.textContent = msg;
    loginError.style.display = msg ? 'block' : 'none';
  }

  loginBtn.addEventListener('click', doLogin);
  tokenInput.addEventListener('keydown', e => { if (e.key === 'Enter') doLogin(); });

  async function showAdmin() {
    loginPage.style.display = 'none';
    adminPanel.style.display = 'block';
    await loadProducts();
    checkTokenExpiration();
  }

  function doLogout() {
    safeSessionRemove('_ry_token');
    safeSessionRemove('_ry_login_time');
    TOKEN = '';
    adminPanel.style.display = 'none';
    loginPage.style.display = 'flex';
    tokenInput.value = '';
    tokenWarning.style.display = 'none';
  }

  async function loadProducts() {
    productList.innerHTML = '<div class="empty-state"><div class="spinner"></div><p>加载中...</p></div>';
    try {
      const file = await getFile(PRODUCTS_PATH);
      if (file) {
        const decoded = decodeFileContent(file.content);
        const data = JSON.parse(decoded);
        products = Array.isArray(data) ? data : (data.products || []);
      } else {
        products = [];
      }
    } catch (err) {
      toast('加载失败: ' + err.message, 'error');
      products = [];
    }
    renderStats();
    renderList();
  }

  function renderStats() {
    const cats = {};
    products.forEach(p => { cats[p.category] = (cats[p.category] || 0) + 1; });
    let html = `<div class="stat-card"><div class="stat-num">${products.length}</div><div class="stat-label">全部产品</div></div>`;
    Object.entries(cats).forEach(([cat, count]) => {
      html += `<div class="stat-card"><div class="stat-num">${count}</div><div class="stat-label">${escapeHtml(cat)}</div></div>`;
    });
    statsBar.innerHTML = html;
  }

  function renderList() {
    if (products.length === 0) {
      productList.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><p>暂无产品，点击上方"＋ 添加"开始</p></div>';
      return;
    }
    productList.innerHTML = products.slice().reverse().map(p => {
      const safeName = escapeHtml(p.name || '');
      const safeCategory = escapeHtml(p.category || '');
      const safeCover = escapeHtml(p.cover || '');
      const imgCount = (p.images || []).length;
      return `
        <div class="product-item" data-id="${p.id}">
          <div class="item-img"><img src="${safeCover}" alt="${safeName}" loading="lazy" decoding="async"
               onerror="this.style.display='none';this.parentElement.style.background='#e8e4de';this.parentElement.innerHTML='<div style=\\'display:flex;align-items:center;justify-content:center;height:100%;color:#ccc;font-size:20px\\'>🖼</div>'"></div>
          <div class="item-info">
            <div class="item-name">${safeName}</div>
            <div class="item-meta">
              <span class="price">¥${Number(p.price || 0).toFixed(1)}</span>
              <span>${safeCategory}</span>
              <span>${imgCount} 图</span>
            </div>
          </div>
          <div class="item-actions">
            <button class="btn btn-sm edit-btn" data-id="${p.id}">编辑</button>
            <button class="btn btn-sm btn-danger del-btn" data-id="${p.id}">删除</button>
          </div>
        </div>
      `;
    }).join('');
  }

  productList.addEventListener('click', async (e) => {
    const editB = e.target.closest('.edit-btn');
    const delB = e.target.closest('.del-btn');
    if (editB) openEditModal(parseInt(editB.dataset.id));
    if (delB) {
      delB.disabled = true;
      delB.textContent = '删除中...';
      try {
        await deleteProduct(parseInt(delB.dataset.id));
      } finally {
        delB.disabled = false;
        delB.textContent = '删除';
      }
    }
  });

  function openAddModal() {
    editingId = null;
    modalTitle.textContent = '添加产品';
    $('fName').value = '';
    $('fPrice').value = '';
    $('fCategory').value = '发饰';
    $('fDesc').value = '';
    tempImages = [];
    originalImages = [];
    hasUnsavedChanges = false;
    renderImagePreviews();
    saveProgress.classList.remove('show');
    editModal.classList.add('show');
  }

  function openEditModal(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    editingId = id;
    modalTitle.textContent = '编辑产品';
    $('fName').value = p.name;
    $('fPrice').value = p.price;
    $('fCategory').value = p.category;
    $('fDesc').value = p.description || '';
    tempImages = (p.images || []).map((url, i) => ({
      uploadedUrl: url,
      isCover: url === p.cover,
      existing: true
    }));
    originalImages = [...(p.images || [])];
    hasUnsavedChanges = false;
    renderImagePreviews();
    saveProgress.classList.remove('show');
    editModal.classList.add('show');
  }

  async function closeEditModal() {
    if (hasUnsavedChanges) {
      const ok = await showConfirm('有未保存的修改，确定要关闭吗？');
      if (!ok) return;
    }
    editModal.classList.remove('show');
    tempImages = [];
    originalImages = [];
    hasUnsavedChanges = false;
    saveProgress.classList.remove('show');
  }

  ['fName', 'fPrice', 'fCategory', 'fDesc'].forEach(id => {
    $(id).addEventListener('input', () => { hasUnsavedChanges = true; });
    $(id).addEventListener('change', () => { hasUnsavedChanges = true; });
  });

  function renderImagePreviews() {
    if (tempImages.length === 0) {
      imagePreviewList.innerHTML = '';
      return;
    }
    imagePreviewList.innerHTML = tempImages.map((img, i) => {
      const src = img.uploadedUrl
        ? escapeHtml(img.uploadedUrl)
        : 'data:image/webp;base64,' + img.base64;
      return `
        <div class="image-preview-item ${img.isCover ? 'is-cover' : ''}" data-index="${i}">
          <img src="${src}" alt="图${i + 1}" decoding="async">
          ${img.isCover ? '<div class="cover-badge">封面</div>' : ''}
          <div class="img-actions">
            <button class="img-btn" data-action="remove" data-index="${i}" title="删除">✕</button>
            ${!img.isCover ? `<button class="img-btn set-cover" data-action="cover" data-index="${i}" title="设为封面">★</button>` : ''}
          </div>
        </div>
      `;
    }).join('');
  }

  imagePreviewList.addEventListener('click', (e) => {
    const btn = e.target.closest('.img-btn');
    if (!btn) return;
    hasUnsavedChanges = true;
    const idx = parseInt(btn.dataset.index);
    const action = btn.dataset.action;
    if (action === 'remove') {
      tempImages.splice(idx, 1);
    } else if (action === 'cover') {
      tempImages.forEach(img => img.isCover = false);
      tempImages[idx].isCover = true;
    }
    renderImagePreviews();
  });

  function isImageFile(file) {
    return file.type && file.type.startsWith('image/');
  }

  fileInput.addEventListener('change', async (e) => {
    const files = Array.from(e.target.files);
    if (files.length === 0) return;
    fileInput.value = '';

    uploadProgress.classList.add('show');
    let done = 0;
    let skipped = 0;

    for (const file of files) {
      if (!isImageFile(file)) {
        toast(`${file.name} 不是图片文件，已跳过`, 'warning');
        skipped++;
        done++;
        continue;
      }

      if (file.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
        toast(`${file.name} 超过 ${MAX_FILE_SIZE_MB}MB 限制，已跳过`, 'warning');
        skipped++;
        done++;
        continue;
      }

      progressText.textContent = `压缩中 (${done + 1}/${files.length}): ${file.name}`;
      progressFill.style.width = ((done / files.length) * 100) + '%';
      try {
        const result = await compressImage(file);
        if (result.size > MAX_FILE_SIZE_MB * 1024 * 1024) {
          toast(`${file.name} 压缩后仍过大，已跳过`, 'warning');
          skipped++;
        } else {
          tempImages.push({ base64: result.base64, isCover: tempImages.length === 0 });
          hasUnsavedChanges = true;
          renderImagePreviews();
        }
      } catch (err) {
        toast('图片处理失败: ' + file.name + ' (' + err.message + ')', 'error');
        skipped++;
      }
      done++;
      progressFill.style.width = ((done / files.length) * 100) + '%';
    }

    const msg = skipped > 0
      ? `完成 ${files.length - skipped}/${files.length} 张，${skipped} 张跳过`
      : `完成，共 ${files.length} 张图片`;
    progressText.textContent = msg;
    setTimeout(() => uploadProgress.classList.remove('show'), 2000);
  });

  uploadArea.addEventListener('dragover', (e) => { e.preventDefault(); uploadArea.classList.add('dragover'); });
  uploadArea.addEventListener('dragleave', () => uploadArea.classList.remove('dragover'));
  uploadArea.addEventListener('drop', (e) => {
    e.preventDefault();
    uploadArea.classList.remove('dragover');
    const dt = e.dataTransfer;
    if (dt.files.length) {
      const imageFiles = Array.from(dt.files).filter(isImageFile);
      if (imageFiles.length === 0) {
        toast('请拖入图片文件', 'warning');
        return;
      }
      if (imageFiles.length < dt.files.length) {
        toast(`已过滤 ${dt.files.length - imageFiles.length} 个非图片文件`, 'warning');
      }
      const newDT = new DataTransfer();
      imageFiles.forEach(f => newDT.items.add(f));
      fileInput.files = newDT.files;
      fileInput.dispatchEvent(new Event('change'));
    }
  });

  async function uploadImageWithRetry(path, base64, message, maxRetries = 3) {
    for (let attempt = 1; attempt <= maxRetries; attempt++) {
      try {
        return await putFile(path, base64, message);
      } catch (err) {
        if (attempt >= maxRetries) throw err;
        const wait = attempt * 2000;
        toast(`上传失败，${wait / 1000}s 后重试 (${attempt}/${maxRetries})`, 'info');
        await new Promise(r => setTimeout(r, wait));
      }
    }
  }

  async function saveProduct() {
    const name = $('fName').value.trim();
    const price = parseFloat($('fPrice').value);
    const category = $('fCategory').value;
    const description = $('fDesc').value.trim();

    if (!name) { toast('请输入产品名称', 'error'); return; }
    if (isNaN(price) || price < 0) { toast('请输入有效价格', 'error'); return; }
    if (tempImages.length === 0) { toast('请至少上传一张图片', 'error'); return; }

    saveBtn.disabled = true;
    saveBtn.textContent = '保存中...';
    saveProgress.classList.add('show');
    saveProgressFill.style.width = '0%';
    saveProgressText.textContent = '准备保存...';

    try {
      const uploadedUrls = [];
      const timestamp = Date.now();
      const newImages = tempImages.filter(img => !img.existing || !img.uploadedUrl);
      const totalSteps = newImages.length + 2;
      let currentStep = 0;

      for (let i = 0; i < tempImages.length; i++) {
        const img = tempImages[i];
        if (img.existing && img.uploadedUrl) {
          uploadedUrls.push(img.uploadedUrl);
          continue;
        }
        const filename = `p${timestamp}_${i}.webp`;
        const path = `${IMAGES_PATH}/${filename}`;
        saveProgressText.textContent = `上传图片 ${currentStep + 1}/${newImages.length}...`;
        saveProgressFill.style.width = ((currentStep / totalSteps) * 100) + '%';

        await uploadImageWithRetry(path, img.base64, `upload image: ${filename}`);
        const url = `https://cdn.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/${path}`;
        uploadedUrls.push(url);
        img.uploadedUrl = url;
        currentStep++;

        await new Promise(r => setTimeout(r, 800));
      }

      let coverIdx = tempImages.findIndex(img => img.isCover);
      if (coverIdx < 0) coverIdx = 0;
      const cover = uploadedUrls[coverIdx];

      if (editingId !== null && originalImages.length > 0) {
        const keepUrls = new Set(uploadedUrls);
        for (const oldUrl of originalImages) {
          if (!keepUrls.has(oldUrl)) {
            const match = oldUrl.match(/rongyan\/images\/([^?]+)/);
            if (match) {
              try {
                saveProgressText.textContent = `清理旧图片: ${match[1]}`;
                const file = await getFile(`${IMAGES_PATH}/${match[1]}`);
                if (file) {
                  await deleteFile(`${IMAGES_PATH}/${match[1]}`, file.sha);
                  await new Promise(r => setTimeout(r, 500));
                }
              } catch (e) {
                console.warn('清理旧图片失败:', match[1], e.message);
              }
            }
          }
        }
      }
      currentStep++;
      saveProgressFill.style.width = ((currentStep / totalSteps) * 100) + '%';

      if (editingId !== null) {
        const idx = products.findIndex(p => p.id === editingId);
        if (idx >= 0) {
          products[idx] = { ...products[idx], name, price, category, description, images: uploadedUrls, cover };
        }
      } else {
        const maxId = products.reduce((max, p) => Math.max(max, p.id || 0), 0);
        products.push({
          id: maxId + 1, name, price, category, description,
          images: uploadedUrls, cover, createdAt: new Date().toISOString()
        });
      }

      saveProgressText.textContent = '保存产品数据...';
      const jsonContent = encodeToBase64(JSON.stringify(products, null, 2));
      const existingFile = await getFile(PRODUCTS_PATH);
      const sha = existingFile ? existingFile.sha : null;
      await putFile(PRODUCTS_PATH, jsonContent, `update products: ${name}`, sha);

      saveProgressText.textContent = '刷新 CDN 缓存...';
      await purgeCDN();

      saveProgressFill.style.width = '100%';
      saveProgressText.textContent = '保存成功！';
      hasUnsavedChanges = false;

      toast('保存成功！', 'success');
      setTimeout(() => {
        closeEditModal();
        setTimeout(loadProducts, 500);
      }, 600);

    } catch (err) {
      toast('保存失败: ' + err.message, 'error');
      saveProgressText.textContent = '保存失败: ' + err.message;
    } finally {
      saveBtn.disabled = false;
      saveBtn.textContent = '保存';
    }
  }

  async function deleteProduct(id) {
    const p = products.find(x => x.id === id);
    if (!p) return;
    const ok = await showConfirm(`确定删除「${p.name}」？\n（产品图片也会一并删除）`);
    if (!ok) return;

    try {
      for (const imgUrl of (p.images || [])) {
        const match = imgUrl.match(/rongyan\/images\/([^?]+)/);
        if (match) {
          const filename = match[1];
          try {
            const file = await getFile(`${IMAGES_PATH}/${filename}`);
            if (file) await deleteFile(`${IMAGES_PATH}/${filename}`, file.sha);
            await new Promise(r => setTimeout(r, 500));
          } catch (e) {
            console.warn('删除图片失败:', filename, e.message);
          }
        }
      }

      products = products.filter(x => x.id !== id);

      const jsonContent = encodeToBase64(JSON.stringify(products, null, 2));
      const existingFile = await getFile(PRODUCTS_PATH);
      const sha = existingFile ? existingFile.sha : null;
      await putFile(PRODUCTS_PATH, jsonContent, `delete product: ${p.name}`, sha);

      await purgeCDN();

      toast('删除成功', 'success');
      setTimeout(loadProducts, 1000);

    } catch (err) {
      toast('删除失败: ' + err.message, 'error');
    }
  }

  addBtn.addEventListener('click', openAddModal);
  refreshBtn.addEventListener('click', loadProducts);
  logoutBtn.addEventListener('click', doLogout);
  modalClose.addEventListener('click', closeEditModal);
  cancelBtn.addEventListener('click', closeEditModal);
  saveBtn.addEventListener('click', saveProduct);

  editModal.addEventListener('click', (e) => {
    if (e.target === editModal) closeEditModal();
  });

  window.addEventListener('beforeunload', (e) => {
    if (hasUnsavedChanges) {
      e.preventDefault();
      e.returnValue = '有未保存的修改，确定要离开吗？';
    }
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'hidden' && hasUnsavedChanges) {
      safeSessionSet('_ry_unsaved', '1');
    }
  });

  if (safeSessionGet('_ry_unsaved')) {
    safeSessionRemove('_ry_unsaved');
    toast('上次编辑可能有未保存的内容', 'warning');
  }

  const savedToken = safeSessionGet('_ry_token');
  if (savedToken) {
    TOKEN = savedToken;
    showAdmin();
  }
})();
</script>
</body>
</html>
