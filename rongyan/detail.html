<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5">
  <title>产品详情 · 拾光饰品</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --primary: #b8860b;
      --primary-light: #d4a843;
      --bg: #faf8f5;
      --text: #2c2c2c;
      --text-light: #999;
      --radius: 12px;
      --top-h: 52px;
    }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* ============ 顶部栏 ============ */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 900;
      height: var(--top-h);
      padding-top: env(safe-area-inset-top, 0px);
      background: rgba(255,255,255,0.9);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding-left: 8px;
      padding-right: 16px;
    }
    .back-btn {
      display: flex;
      align-items: center;
      gap: 4px;
      background: none;
      border: none;
      font-size: 15px;
      color: var(--text);
      cursor: pointer;
      padding: 10px 12px 10px 8px;
      border-radius: 8px;
      text-decoration: none;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
      transition: background 0.2s;
    }
    .back-btn:hover {
      background: rgba(0,0,0,0.04);
    }
    .back-btn svg {
      width: 20px;
      height: 20px;
      flex-shrink: 0;
    }
    .topbar-title {
      font-size: 14px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--primary);
      user-select: none;
    }
    .topbar-right {
      width: 60px;
    }
    /* ============ 加载/错误 ============ */
    .page-status {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 70vh;
      padding-top: var(--top-h);
      color: var(--text-light);
      gap: 12px;
    }
    .spinner {
      width: 32px;
      height: 32px;
      border: 3px solid #eee;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    /* ============ 轮播区 ============ */
    .gallery {
      margin-top: calc(var(--top-h) + env(safe-area-inset-top, 0px));
      position: relative;
      background: #f0ece6;
      touch-action: pan-y;
      overflow: hidden;
      user-select: none;
      -webkit-user-select: none;
    }
    .track {
      display: flex;
      will-change: transform;
    }
    .track.animating {
      transition: transform 0.38s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    }
    .slide {
      flex: 0 0 100%;
      width: 100%;
      min-width: 0;
      position: relative;
    }
    .slide img {
      display: block;
      width: 100%;
      height: auto;
      cursor: zoom-in;
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: auto;
    }
    /* 移动端正方形 */
    @media (max-width: 767px) {
      .slide { padding-top: 100%; }
      .slide img {
        position: absolute;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
    }
    /* 桌面端居中限宽 */
    @media (min-width: 768px) {
      .gallery {
        max-width: 680px;
        margin-left: auto;
        margin-right: auto;
        border-radius: 0 0 var(--radius) var(--radius);
      }
    }
    .counter {
      position: absolute;
      bottom: 14px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(0,0,0,0.4);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      color: #fff;
      padding: 4px 14px;
      border-radius: 20px;
      font-size: 12px;
      letter-spacing: 2px;
      pointer-events: none;
      z-index: 5;
    }
    .arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 40px;
      height: 40px;
      border-radius: 50%;
      background: rgba(255,255,255,0.85);
      backdrop-filter: blur(6px);
      -webkit-backdrop-filter: blur(6px);
      border: none;
      cursor: pointer;
      display: none;
      align-items: center;
      justify-content: center;
      box-shadow: 0 2px 12px rgba(0,0,0,0.1);
      z-index: 10;
      opacity: 0;
      transition: opacity 0.25s, background 0.2s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .arrow:hover {
      background: #fff;
      box-shadow: 0 4px 20px rgba(0,0,0,0.15);
    }
    .arrow svg {
      width: 18px;
      height: 18px;
      color: var(--text);
    }
    .arrow-left { left: 12px; }
    .arrow-right { right: 12px; }
    @media (min-width: 768px) {
      .arrow { display: flex; }
      .gallery:hover .arrow { opacity: 1; }
    }
    .thumbs {
      display: flex;
      gap: 8px;
      padding: 14px 16px;
      overflow-x: auto;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: none;
      background: #fff;
    }
    .thumbs::-webkit-scrollbar { display: none; }
    .thumb {
      flex-shrink: 0;
      width: 56px;
      height: 56px;
      border-radius: 8px;
      overflow: hidden;
      cursor: pointer;
      border: 2px solid transparent;
      opacity: 0.5;
      transition: all 0.25s;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .thumb:hover { opacity: 0.8; }
    .thumb.active {
      border-color: var(--primary);
      opacity: 1;
      box-shadow: 0 2px 8px rgba(184,134,11,0.2);
    }
    .thumb img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      -webkit-user-drag: none;
      pointer-events: none;
    }
    /* ============ 产品信息 ============ */
    .info {
      max-width: 680px;
      margin: 0 auto;
      padding: 28px 20px 80px;
    }
    .info-cat {
      display: inline-block;
      background: linear-gradient(135deg, var(--primary), var(--primary-light));
      color: #fff;
      padding: 3px 14px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      letter-spacing: 1px;
      margin-bottom: 14px;
    }
    .info-name {
      font-size: 22px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .info-price {
      font-size: 28px;
      font-weight: 800;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .info-price::before {
      content: '¥';
      font-size: 16px;
      margin-right: 2px;
    }
    .info-divider {
      width: 40px;
      height: 3px;
      background: linear-gradient(90deg, var(--primary), var(--primary-light));
      border-radius: 2px;
      margin-bottom: 20px;
    }
    .info-desc {
      font-size: 15px;
      line-height: 1.85;
      color: #555;
    }
    /* ============ 灯箱 ============ */
    .lightbox {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0,0,0,0.95);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      visibility: hidden;
      transition: opacity 0.3s ease, visibility 0.3s ease;
      touch-action: pan-y;
      -webkit-user-select: none;
      user-select: none;
    }
    .lightbox.open {
      opacity: 1;
      visibility: visible;
    }
    .lb-img {
      max-width: 94vw;
      max-height: 90vh;
      object-fit: contain;
      border-radius: 4px;
      transform: scale(0.9);
      transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94);
      cursor: zoom-out;
      -webkit-user-drag: none;
      user-select: none;
      pointer-events: auto;
    }
    .lightbox.open .lb-img {
      transform: scale(1);
    }
    .lb-close {
      position: absolute;
      top: 16px;
      right: 16px;
      width: 42px;
      height: 42px;
      border-radius: 50%;
      background: rgba(255,255,255,0.12);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .lb-close:hover {
      background: rgba(255,255,255,0.25);
    }
    .lb-close svg {
      width: 20px;
      height: 20px;
      color: #fff;
    }
    .lb-arrow {
      position: absolute;
      top: 50%;
      transform: translateY(-50%);
      width: 44px;
      height: 44px;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
      -webkit-tap-highlight-color: transparent;
      touch-action: manipulation;
    }
    .lb-arrow:hover {
      background: rgba(255,255,255,0.22);
    }
    .lb-arrow svg {
      width: 20px;
      height: 20px;
      color: #fff;
    }
    .lb-prev { left: 12px; }
    .lb-next { right: 12px; }
    @media (max-width: 767px) {
      .lb-arrow { display: none; }
    }
    .lb-counter {
      position: absolute;
      bottom: 24px;
      left: 50%;
      transform: translateX(-50%);
      color: rgba(255,255,255,0.65);
      font-size: 13px;
      letter-spacing: 3px;
      pointer-events: none;
      z-index: 10;
    }
    .safe-bottom {
      height: env(safe-area-inset-bottom, 0px);
    }
    ::-webkit-scrollbar {
      width: 6px;
    }
    ::-webkit-scrollbar-track {
      background: transparent;
    }
    ::-webkit-scrollbar-thumb {
      background: #d0c8b8;
      border-radius: 3px;
    }
  </style>
</head>
<body>
  <header class="topbar">
    <a class="back-btn" href="index.html">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      返回
    </a>
    <span class="topbar-title">产品详情</span>
    <div class="topbar-right"></div>
  </header>

  <div class="page-status" id="status">
    <div class="spinner"></div>
    <p>加载中...</p>
  </div>

  <div id="content" style="display:none">
    <div class="gallery" id="gallery">
      <div class="track" id="track"></div>
      <button class="arrow arrow-left" id="aLeft" aria-label="上一张">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
      </button>
      <button class="arrow arrow-right" id="aRight" aria-label="下一张">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
      </button>
      <div class="counter" id="counter">1 / 1</div>
    </div>
    <div class="thumbs" id="thumbs"></div>
    <div class="info">
      <span class="info-cat" id="iCat"></span>
      <h1 class="info-name" id="iName"></h1>
      <div class="info-price" id="iPrice"></div>
      <div class="info-divider"></div>
      <p class="info-desc" id="iDesc"></p>
    </div>
    <div class="safe-bottom"></div>
  </div>

  <!-- 灯箱 -->
  <div class="lightbox" id="lb">
    <button class="lb-close" id="lbClose" aria-label="关闭">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
    </button>
    <button class="lb-arrow lb-prev" id="lbPrev" aria-label="上一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
    </button>
    <img class="lb-img" id="lbImg" src="" alt="" draggable="false">
    <button class="lb-arrow lb-next" id="lbNext" aria-label="下一张">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 6 15 12 9 18"/></svg>
    </button>
    <div class="lb-counter" id="lbCounter"></div>
  </div>

  <script>
    ;(function() {
      'use strict';

      // --- 元素选择 ---
      var statusEl = document.getElementById('status');

      var gallery = document.getElementById('gallery');

      var thumbs = document.getElementById('thumbs');
      var counter = document.getElementById('counter');
      var aLeft = document.getElementById('aLeft');
      var aRight = document.getElementById('aRight');

      var lbImg = document.getElementById('lbImg');
      var lbClose = document.getElementById('lbClose');
      var lbPrev = document.getElementById('lbPrev');
      var lbNext = document.getElementById('lbNext');
      var lbCounter = document.getElementById('lbCounter');

      // --- 状态变量 ---
      var images = [];
      var current = 0;
      var lbIndex = 0;
      var lbOpen = false;
      var galleryW = 0;
      var didDrag = false;

      var params = new URLSearchParams(window.location.search);
      var pid = parseInt(params.get('id'), 10);

      fetch('products.json')
        .then(function(r) {
          if (!r.ok) throw new Error('网络错误');
          return r.json();
        })
        .then(function(data) {
          var product = null;
          for (var i = 0; i < data.products.length; i++) {
            if (data.products[i].id === pid) {
              product = data.products[i];
              break;
            }
          }
