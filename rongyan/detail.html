<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="theme-color" content="#faf8f5">
  <title>产品详情 · 绒颜</title>
  <style>
    *, *::before, *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    :root {
      --primary: #b8860b;
      --primary-light: #d4a843;
      --bg: #faf8f5;
      --text: #2c2c2c;
      --text-light: #999;
      --radius: 12px;
      --top-h: 52px;
    }
    html {
      -webkit-text-size-adjust: 100%;
      scroll-behavior: smooth;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
      background: var(--bg);
      color: var(--text);
      -webkit-font-smoothing: antialiased;
      min-height: 100vh;
      overflow-x: hidden;
    }
    /* ============ 顶部栏 ============ */
    .topbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      z-index: 900;
      height: var(--top-h);
      padding-top: env(safe-area-inset-top, 0px);
      background: rgba(255,255,255,0.9);
      backdrop-filter: saturate(180%) blur(20px);
      -webkit-backdrop-filter: saturate(180%) blur(20px);
      border-bottom: 1px solid rgba(0,0,0,0.06);
      display: flex;
      align-items: center;
      justify-content: center;
    }
    .topbar h1 {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: 2px;
      color: var(--primary);
    }
    .topbar .back-btn {
      position: absolute;
      left: 12px;
      top: 50%;
      transform: translateY(-50%);
      width: 36px;
      height: 36px;
      border: none;
      background: transparent;
      font-size: 20px;
      cursor: pointer;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      -webkit-tap-highlight-color: transparent;
    }
    .topbar .back-btn:active {
      background: rgba(0,0,0,0.08);
    }

    /* ============ 主体内容 ============ */
    .main {
      padding-top: calc(var(--top-h) + env(safe-area-inset-top, 0px));
      max-width: 600px;
      margin: 0 auto;
      background: #fff;
      box-shadow: 0 0 20px rgba(0,0,0,0.05);
    }
    .product-gallery {
      position: relative;
      width: 100%;
      padding-top: 100%;
      overflow: hidden;
      background: #f0ece6;
    }
    .product-gallery img {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      transition: transform 0.5s ease;
    }
    .product-gallery img:active {
      transform: scale(1.05);
    }
    .product-info {
      padding: 20px;
    }
    .product-category {
      display: inline-block;
      padding: 4px 10px;
      background: rgba(184, 134, 11, 0.1);
      color: var(--primary);
      font-size: 12px;
      font-weight: 600;
      border-radius: 20px;
      margin-bottom: 12px;
    }
    .product-name {
      font-size: 20px;
      font-weight: 700;
      line-height: 1.4;
      margin-bottom: 12px;
    }
    .product-price {
      font-size: 24px;
      font-weight: 700;
      color: var(--primary);
      margin-bottom: 20px;
    }
    .product-price::before {
      content: '¥';
      font-size: 14px;
      margin-right: 2px;
    }
    .product-desc-title {
      font-size: 14px;
      font-weight: 600;
      margin-bottom: 8px;
      color: var(--text);
    }
    .product-desc {
      font-size: 14px;
      line-height: 1.7;
      color: var(--text-light);
      margin-bottom: 24px;
    }
    .thumbnails {
      display: flex;
      gap: 10px;
      overflow-x: auto;
      padding-bottom: 10px;
      scrollbar-width: none;
    }
    .thumbnails::-webkit-scrollbar {
      display: none;
    }
    .thumbnail {
      flex-shrink: 0;
      width: 60px;
      height: 60px;
      border-radius: 8px;
      overflow: hidden;
      border: 2px solid transparent;
      cursor: pointer;
      opacity: 0.6;
      transition: all 0.3s ease;
    }
    .thumbnail.active {
      border-color: var(--primary);
      opacity: 1;
    }
    .thumbnail img {
      width: 100%;
      height: 100%;
      object-fit: cover;
    }
    .action-bar {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      padding: 10px env(safe-area-inset-right, 16px) calc(10px + env(safe-area-inset-bottom, 0px)) env(safe-area-inset-left, 16px);
      background: #fff;
      border-top: 1px solid rgba(0,0,0,0.06);
      display: flex;
      gap: 12px;
      z-index: 900;
    }
    .action-bar button {
      flex: 1;
      padding: 14px;
      border: none;
      border-radius: var(--radius);
      font-size: 15px;
      font-weight: 600;
      cursor: pointer;
      transition: all 0.2s ease;
    }
    .btn-cart {
      background: #f0ece6;
      color: var(--text);
    }
    .btn-buy {
      background: var(--primary);
      color: #fff;
    }
    .btn-cart:active, .btn-buy:active {
      opacity: 0.9;
      transform: scale(0.98);
    }
    .loading, .error {
      position: fixed;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
      color: var(--text-light);
    }
    .spinner {
      width: 30px;
      height: 30px;
      border: 3px solid #eee;
      border-top-color: var(--primary);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 0 auto 12px;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
  </style>
</head>
<body>

  <div class="topbar">
    <button class="back-btn" onclick="history.back()">←</button>
    <h1>产品详情</h1>
  </div>

  <main class="main" id="product-container">
    <div class="loading">
      <div class="spinner"></div>
      <p>正在加载...</p>
    </div>
  </main>

  <div class="action-bar">
    <button class="btn-cart">加入购物车</button>
    <button class="btn-buy">立即购买</button>
  </div>

  <script>
    ;(function() {
      'use strict';

      const container = document.getElementById('product-container');
      const urlParams = new URLSearchParams(window.location.search);
      const productId = urlParams.get('id');

      if (!productId) {
        container.innerHTML = '<div class="error"><p>❌ 未找到产品ID</p></div>';
        return;
      }

      // 1. 获取数据
      fetch('products.json')
        .then(response => {
          if (!response.ok) throw new Error('网络错误');
          return response.json();
        })
        .then(data => {
          // 2. 查找产品 (只遍历一次)
          const product = data.products.find(p => p.id == productId);

          if (!product) {
            container.innerHTML = '<div class="error"><p>❌ 未找到该产品</p></div>';
            return;
          }

          // 3. 渲染页面
          renderProduct(product);
        })
        .catch(err => {
          console.error(err);
          container.innerHTML = '<div class="error"><p>❌ 加载失败</p><p style="font-size:12px;margin-top:8px;">请确认 products.json 存在且通过 HTTP 服务器访问</p></div>';
        });

      function renderProduct(p) {
        // 生成缩略图HTML
        let thumbnailsHtml = '';
        p.images.forEach((imgSrc, index) => {
          const activeClass = index === 0 ? 'active' : '';
          thumbnailsHtml += `
            <div class="thumbnail ${activeClass}" onclick="changeMainImage(this, '${imgSrc}')">
              <img src="${imgSrc}" alt="缩略图" loading="lazy">
            </div>
          `;
        });

        // 设置页面标题
        document.title = p.name + ' · 绒颜';

        // 填充主内容
        container.innerHTML = `
          <div class="product-gallery">
            <img id="main-image" src="${p.images[0]}" alt="${p.name}" loading="lazy">
          </div>
          <div class="product-info">
            <span class="product-category">${p.category}</span>
            <h2 class="product-name">${p.name}</h2>
            <div class="product-price">${p.price.toFixed(1)}</div>
            <div class="product-desc-title">商品详情</div>
            <p class="product-desc">${p.description}</p>
            <div class="product-desc-title">更多图片</div>
            <div class="thumbnails">
              ${thumbnailsHtml}
            </div>
          </div>
        `;
      }
    })();

    // 切换到主图
    function changeMainImage(thumbnailElement, newSrc) {
      // 1. 更新主图
      document.getElementById('main-image').src = newSrc;

      // 2. 更新缩略图样式
      const thumbnails = document.querySelectorAll('.thumbnail');
      thumbnails.forEach(thumb => thumb.classList.remove('active'));
      thumbnailElement.classList.add('active');
    }
  </script>
</body>
</html>
