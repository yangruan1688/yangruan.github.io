<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#faf8f5">
<title>扬软</title>
<style>
  /* ============ 基础重置 ============ */
  *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

  :root {
    --primary: #b8860b;
    --primary-light: #d4a843;
    --bg: #faf8f5;
    --card-bg: #ffffff;
    --text: #2c2c2c;
    --text-light: #999;
    --shadow: 0 2px 16px rgba(0,0,0,0.06);
    --shadow-hover: 0 8px 30px rgba(0,0,0,0.12);
    --radius: 12px;
  }

  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
  }

  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', 'Helvetica Neue', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    -moz-osx-font-smoothing: grayscale;
    min-height: 100vh;
    overflow-x: hidden;
    /* padding-top 会在下面根据屏幕宽度设置 */
  }

  /* ============ 固定导航栏 ============ */
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    background: rgba(255,255,255,0.88);
    backdrop-filter: saturate(180%) blur(20px);
    -webkit-backdrop-filter: saturate(180%) blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 16px;
    padding-top: calc(10px + env(safe-area-inset-top, 0px));
  }

  .brand {
    text-align: center;
    font-size: 14px;
    letter-spacing: 6px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 8px;
    user-select: none;
  }

  /* 导航分类容器 - 支持横向滑动 */
  .categories {
    display: flex;
    justify-content: flex-start;
    gap: 8px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    padding: 0 4px;
    scroll-snap-type: x proximity;
  }
  .categories::-webkit-scrollbar { display: none; }

  /* 两端留白呼吸感 */
  .categories::before,
  .categories::after {
    content: '';
    flex-shrink: 0;
    width: 4px;
  }

  .nav-btn {
    flex-shrink: 0;
    padding: 7px 18px;
    border: 1.5px solid transparent;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
    white-space: nowrap;
    user-select: none;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
    scroll-snap-align: center;
  }
  .nav-btn:hover {
    color: var(--primary);
    background: rgba(184,134,11,0.06);
  }
  .nav-btn.active {
    background: var(--primary);
    color: #fff;
    border-color: var(--primary);
    box-shadow: 0 2px 12px rgba(184,134,11,0.3);
  }
  .nav-btn .icon { margin-right: 3px; font-size: 14px; }

  /* 小屏手机优化 */
  @media (max-width: 420px) {
    .navbar { padding: 8px 12px; padding-top: calc(8px + env(safe-area-inset-top, 0px)); }
    .brand { font-size: 12px; letter-spacing: 4px; margin-bottom: 6px; }
    .nav-btn { padding: 5px 14px; font-size: 13px; }
  }

  /* ============ 主内容 ============ */
  .main {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }

  .section-title {
    text-align: center;
    margin-bottom: 28px;
    font-size: 14px;
    color: var(--text-light);
    letter-spacing: 2px;
    user-select: none;
  }
  .section-title span {
    color: var(--primary);
    font-weight: 600;
  }

  /* ============ 产品网格 ============ */
  .grid {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 12px;
  }
  @media (min-width: 520px)  { .grid { grid-template-columns: repeat(3, 1fr); gap: 16px; } }
  @media (min-width: 768px)  { .grid { grid-template-columns: repeat(4, 1fr); gap: 20px; } }
  @media (min-width: 1024px) { .grid { grid-template-columns: repeat(5, 1fr); gap: 22px; } }

  /* ============ 产品卡片 ============ */
  .card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: transform 0.35s cubic-bezier(0.25,0.46,0.45,0.94),
                box-shadow 0.35s ease;
    text-decoration: none;
    color: inherit;
    display: block;
    opacity: 0;
    transform: translateY(20px);
    animation: fadeUp 0.45s ease forwards;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }
  .card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow-hover);
  }
  .card:active {
    transform: scale(0.97);
    transition-duration: 0.1s;
  }

  @keyframes fadeUp {
    to { opacity: 1; transform: translateY(0); }
  }

  .card-img-wrap {
    position: relative;
    width: 100%;
    padding-top: 100%;
    overflow: hidden;
    background: #f0ece6;
  }
  .card-img-wrap img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }
  .card:hover .card-img-wrap img {
    transform: scale(1.05);
  }

  .card-img-wrap .img-fallback {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    background: #f0ece6;
    color: #ccc;
    font-size: 32px;
    gap: 6px;
  }
  .card-img-wrap .img-fallback span {
    font-size: 11px;
    color: #bbb;
  }

  .card-tag {
    position: absolute;
    top: 8px; left: 8px;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(6px);
    -webkit-backdrop-filter: blur(6px);
    padding: 2px 10px;
    border-radius: 20px;
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
    pointer-events: none;
  }

  .card-info { padding: 12px 12px 14px; }
  .card-name {
    font-size: 13px;
    font-weight: 600;
    margin-bottom: 6px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  @media (min-width: 768px) { .card-name { font-size: 14px; } }
  .card-price {
    font-size: 17px;
    font-weight: 700;
    color: var(--primary);
  }
  .card-price::before {
    content: '¥';
    font-size: 11px;
    margin-right: 1px;
  }

  /* ============ 空状态/加载 ============ */
  .empty, .loading {
    grid-column: 1 / -1;
    text-align: center;
    padding: 60px 20px;
    color: var(--text-light);
  }
  .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .spinner {
    width: 30px; height: 30px;
    border: 3px solid #eee;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.7s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ============ 页脚 ============ */
  .footer {
    text-align: center;
    padding: 30px 20px;
    color: var(--text-light);
    font-size: 12px;
    letter-spacing: 1px;
    border-top: 1px solid rgba(0,0,0,0.04);
    margin-top: 20px;
  }

  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0c8b8; border-radius: 3px; }
</style>
</head>
<body>

<!-- 固定导航栏 -->
<nav class="navbar" id="navbar">
  <div class="brand">✦ 绒颜 ✦</div>
  <div class="categories" id="cats">
    <button class="nav-btn active" data-cat="全部"><span class="icon">🏠</span>全部</button>
    <button class="nav-btn" data-cat="发饰"><span class="icon">💇‍♀️</span>发饰</button>
    <button class="nav-btn" data-cat="耳饰"><span class="icon">✨</span>耳饰</button>
    <button class="nav-btn" data-cat="胸针"><span class="icon">🌸</span>胸针</button>
    <button class="nav-btn" data-cat="其他"><span class="icon">🎁</span>其他</button>
  </div>
</nav>

<!-- 主内容 -->
<main class="main">
  <div class="section-title" id="title">—— 为你精选 <span>全部</span> 饰品 ——</div>
  <div class="grid" id="grid">
    <div class="loading"><div class="spinner"></div><p>正在加载产品...</p></div>
  </div>
</main>

<footer class="footer">© 2026 扬软</footer>

<script>
;(function() {
  'use strict';

  var allProducts = [];
  var grid = document.getElementById('grid');
  var cats = document.getElementById('cats');
  var titleEl = document.getElementById('title');
  var navbar = document.getElementById('navbar');

  // ====== 动态设置 body padding-top 以适配导航栏高度 ======
  function adjustBodyPadding() {
    var navHeight = navbar.offsetHeight;
    document.body.style.paddingTop = navHeight + 'px';
  }
  adjustBodyPadding();
  window.addEventListener('resize', adjustBodyPadding);

  // ====== 加载数据 ======
  fetch('products.json')
    .then(function(r) {
      if (!r.ok) throw new Error('网络错误');
      return r.json();
    })
    .then(function(data) {
      allProducts = data.products || [];
      render(allProducts);
    })
    .catch(function() {
      grid.innerHTML =
        '<div class="empty">' +
          '<div class="empty-icon">😢</div>' +
          '<p>产品加载失败</p>' +
          '<p style="font-size:12px;margin-top:8px;color:#bbb">请确认 products.json 存在且通过 HTTP 服务器访问</p>' +
        '</div>';
    });

  // ====== 分类切换 ======
  cats.addEventListener('click', function(e) {
    var btn = e.target.closest('.nav-btn');
    if (!btn) return;

    var btns = cats.querySelectorAll('.nav-btn');
    for (var i = 0; i < btns.length; i++) btns[i].classList.remove('active');
    btn.classList.add('active');

    // 自动滚动导航栏，让当前按钮居中显示
    var catsRect = cats.getBoundingClientRect();
    var btnRect = btn.getBoundingClientRect();
    var scrollTarget = cats.scrollLeft + (btnRect.left - catsRect.left) - (catsRect.width / 2) + (btnRect.width / 2);
    cats.scrollTo({ left: scrollTarget, behavior: 'smooth' });

    var cat = btn.getAttribute('data-cat');
    titleEl.innerHTML = '—— 为你精选 <span>' + cat + '</span> 饰品 ——';

    var list = (cat === '全部') ? allProducts : allProducts.filter(function(p) {
      return p.category === cat;
    });
    render(list);

    window.scrollTo({ top: 0, behavior: 'smooth' });
  });

  // ====== 渲染产品 ======
  function render(products) {
    if (!products.length) {
      grid.innerHTML =
        '<div class="empty">' +
          '<div class="empty-icon">🔍</div>' +
          '<p>该分类暂无产品</p>' +
        '</div>';
      return;
    }

    var html = '';
    for (var i = 0; i < products.length; i++) {
      var p = products[i];
      var delay = (i * 0.05).toFixed(2);
      html +=
        '<a class="card" href="detail.html?id=' + p.id + '" style="animation-delay:' + delay + 's">' +
          '<div class="card-img-wrap">' +
            '<img src="' + p.cover + '" alt="' + escHtml(p.name) + '" loading="lazy"' +
            ' onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\'">' +
            '<div class="img-fallback" style="display:none"><div>🖼️</div><span>图片加载失败</span></div>' +
            '<span class="card-tag">' + escHtml(p.category) + '</span>' +
          '</div>' +
          '<div class="card-info">' +
            '<div class="card-name">' + escHtml(p.name) + '</div>' +
            '<div class="card-price">' + p.price.toFixed(1) + '</div>' +
          '</div>' +
        '</a>';
    }
    grid.innerHTML = html;
  }

  function escHtml(s) {
    var d = document.createElement('div');
    d.textContent = s;
    return d.innerHTML;
  }
})();
</script>
</body>
</html>
