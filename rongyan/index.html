<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>拾光饰品 · 精品商铺</title>
<style>
  /* ========== 基础重置与全局 ========== */
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #b8860b;
    --primary-light: #d4a843;
    --bg: #faf8f5;
    --card-bg: #ffffff;
    --text: #2c2c2c;
    --text-light: #888;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
    --shadow-hover: 0 8px 32px rgba(0,0,0,0.12);
    --radius: 12px;
    --nav-height: 72px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding-top: var(--nav-height);
  }

  /* ========== 顶部导航栏（固定悬浮） ========== */
  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    height: var(--nav-height);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 0 20px;
  }
  .navbar-brand {
    text-align: center;
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .navbar-categories {
    display: flex;
    justify-content: center;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
  }
  .navbar-categories::-webkit-scrollbar { display: none; }
  .nav-btn {
    flex-shrink: 0;
    padding: 6px 18px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 14px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
    white-space: nowrap;
    position: relative;
  }
  .nav-btn:hover {
    color: var(--primary);
    background: rgba(184,134,11,0.06);
  }
  .nav-btn.active {
    background: var(--primary);
    color: #fff;
    box-shadow: 0 2px 12px rgba(184,134,11,0.3);
  }
  .nav-btn .nav-icon {
    margin-right: 4px;
    font-size: 15px;
  }

  /* ========== 产品展示区 ========== */
  .main-container {
    max-width: 1200px;
    margin: 0 auto;
    padding: 24px 16px 60px;
  }
  .section-title {
    text-align: center;
    margin-bottom: 28px;
    font-size: 15px;
    color: var(--text-light);
    letter-spacing: 2px;
  }
  .section-title span {
    color: var(--primary);
    font-weight: 600;
  }

  /* ========== 产品网格 ========== */
  .product-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
    gap: 16px;
  }
  @media (min-width: 768px) {
    .product-grid {
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 24px;
    }
  }

  /* ========== 产品卡片 ========== */
  .product-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    text-decoration: none;
    color: inherit;
    display: block;
    animation: cardIn 0.5s ease backwards;
  }
  .product-card:hover {
    transform: translateY(-6px);
    box-shadow: var(--shadow-hover);
  }
  @keyframes cardIn {
    from { opacity: 0; transform: translateY(24px); }
    to   { opacity: 1; transform: translateY(0); }
  }
  .product-card .card-img-wrap {
    position: relative;
    width: 100%;
    padding-top: 100%;
    overflow: hidden;
    background: #f0ece6;
  }
  .product-card .card-img-wrap img {
    position: absolute;
    top: 0; left: 0;
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
  }
  .product-card:hover .card-img-wrap img {
    transform: scale(1.06);
  }
  .product-card .card-tag {
    position: absolute;
    top: 10px; left: 10px;
    background: rgba(255,255,255,0.88);
    backdrop-filter: blur(6px);
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    color: var(--primary);
    font-weight: 600;
  }
  .product-card .card-info {
    padding: 14px 14px 16px;
  }
  .product-card .card-name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 6px;
    line-height: 1.4;
    display: -webkit-box;
    -webkit-line-clamp: 2;
    -webkit-box-orient: vertical;
    overflow: hidden;
  }
  .product-card .card-price {
    font-size: 18px;
    font-weight: 700;
    color: var(--primary);
  }
  .product-card .card-price::before {
    content: '¥';
    font-size: 12px;
    margin-right: 1px;
  }

  /* ========== 空状态 ========== */
  .empty-state {
    text-align: center;
    padding: 80px 20px;
    color: var(--text-light);
  }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }

  /* ========== 加载动画 ========== */
  .loading {
    text-align: center;
    padding: 60px;
    color: var(--text-light);
  }
  .loading .spinner {
    width: 32px; height: 32px;
    border: 3px solid #eee;
    border-top-color: var(--primary);
    border-radius: 50%;
    animation: spin 0.8s linear infinite;
    margin: 0 auto 12px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }

  /* ========== 页脚 ========== */
  .footer {
    text-align: center;
    padding: 30px;
    color: var(--text-light);
    font-size: 12px;
    letter-spacing: 1px;
    border-top: 1px solid rgba(0,0,0,0.05);
    margin-top: 40px;
  }

  /* ========== 滚动条美化 ========== */
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0c8b8; border-radius: 3px; }
</style>
</head>
<body>

<!-- 固定导航栏 -->
<nav class="navbar">
  <div class="navbar-brand">✦ 拾光饰品 ✦</div>
  <div class="navbar-categories" id="navCategories">
    <button class="nav-btn active" data-category="全部">
      <span class="nav-icon">🏠</span>全部
    </button>
    <button class="nav-btn" data-category="发饰">
      <span class="nav-icon">💇‍♀️</span>发饰
    </button>
    <button class="nav-btn" data-category="耳饰">
      <span class="nav-icon">✨</span>耳饰
    </button>
    <button class="nav-btn" data-category="胸针">
      <span class="nav-icon">🌸</span>胸针
    </button>
    <button class="nav-btn" data-category="其他">
      <span class="nav-icon">🎁</span>其他
    </button>
  </div>
</nav>

<!-- 主内容区 -->
<div class="main-container">
  <div class="section-title" id="sectionTitle">
    —— 为你精选 <span>全部</span> 饰品 ——
  </div>
  <div class="product-grid" id="productGrid">
    <div class="loading">
      <div class="spinner"></div>
      <p>正在加载产品...</p>
    </div>
  </div>
</div>

<div class="footer">© 2026 拾光饰品 · 用心挑选每一件美好</div>

<script>
(function () {
  let allProducts = [];
  let currentCategory = '全部';

  const grid = document.getElementById('productGrid');
  const navContainer = document.getElementById('navCategories');
  const sectionTitle = document.getElementById('sectionTitle');

  // 加载 JSON 数据
  fetch('products.json')
    .then(r => r.json())
    .then(data => {
      allProducts = data.products;
      renderProducts(allProducts);
    })
    .catch(() => {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-icon">😢</div>
          <p>产品加载失败，请确认 products.json 文件存在</p>
        </div>`;
    });

  // 导航点击
  navContainer.addEventListener('click', function (e) {
    const btn = e.target.closest('.nav-btn');
    if (!btn) return;

    navContainer.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');

    currentCategory = btn.dataset.category;
    sectionTitle.innerHTML = `—— 为你精选 <span>${currentCategory}</span> 饰品 ——`;

    const filtered = currentCategory === '全部'
      ? allProducts
      : allProducts.filter(p => p.category === currentCategory);

    renderProducts(filtered);
  });

  // 渲染产品卡片
  function renderProducts(products) {
    if (products.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-icon">🔍</div>
          <p>该分类暂无产品</p>
        </div>`;
      return;
    }

    grid.innerHTML = products.map((p, i) => `
      <a class="product-card" href="detail.html?id=${p.id}"
         style="animation-delay:${i * 0.06}s">
        <div class="card-img-wrap">
          <img src="${p.cover}" alt="${p.name}" loading="lazy">
          <span class="card-tag">${p.category}</span>
        </div>
        <div class="card-info">
          <div class="card-name">${p.name}</div>
          <div class="card-price">${p.price.toFixed(1)}</div>
        </div>
      </a>
    `).join('');
  }
})();
</script>
</body>
</html>
