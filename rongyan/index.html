<!DOCTYPE html>
<html lang="en">

  <title>扬软</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <nav class="navbar">
    <ul>
      <li class="active" data-category="all">全部</li>
      <li data-category="hair">发饰</li>

  <script src="script.js"></script>
