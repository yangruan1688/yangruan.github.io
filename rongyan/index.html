<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, follow">
<title>绒颜 | 扬州绒花缠花文创品牌</title>
<meta name="description" content="绒颜">
<link rel="icon" href="https://raw.githubusercontent.com/yangruan1688/yangruan.github.io/main/logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://api.github.com" crossorigin>
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #b8860b;
  --primary-light: #d4a843;
  --bg: #faf8f5;
  --card-bg: #ffffff;
  --text: #2c2c2c;
  --text-light: #999;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
  padding-bottom: 80px; outline: none; /* 防止body聚焦时出现边框 */
}

/* 顶部标题栏 */
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
}
.header h1 { 
  font-size: 18px; color: var(--primary); letter-spacing: 4px; font-weight: 600;
  position: absolute; left: 50%; transform: translateX(-50%);
}
.header-nav-btn {
  color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500;
  padding: 5px 10px; border-radius: 18px; transition: all 0.25s;
  background: none; border: none; cursor: pointer;
}
.header-nav-btn:hover { background: rgba(184,134,11,0.1); color: var(--primary); }

/* 底部悬浮导航栏 */
.bottom-nav {
  position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);
  background: rgba(255,255,255,0.95); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-radius: 28px; padding: 12px 20px;
  box-shadow: 0 8px 32px rgba(0,0,0,0.15);
  display: flex; gap: 12px; align-items: center;
  z-index: 200; max-width: 90%;
}
.nav-item {
  position: relative; display: flex; flex-direction: column; align-items: center;
  gap: 4px; color: var(--text); text-decoration: none; font-size: 11px;
  padding: 6px 10px; border-radius: 16px; transition: all 0.25s;
  cursor: pointer; border: none; background: none;
}
.nav-item:hover { background: rgba(184,134,11,0.1); color: var(--primary); }
.nav-item.active { color: var(--primary); }
.nav-icon { font-size: 20px; }

/* 下拉菜单 */
.dropdown {
  position: absolute; bottom: 100%; left: 50%; transform: translateX(-50%);
  margin-bottom: 12px; background: #fff; border-radius: 12px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.12); padding: 8px 0;
  min-width: 120px; display: none; flex-direction: column;
}
.dropdown.show { display: flex; }
.dropdown::after {
  content: ''; position: absolute; bottom: -6px; left: 50%; transform: translateX(-50%);
  width: 0; height: 0; border-left: 6px solid transparent;
  border-right: 6px solid transparent; border-top: 6px solid #fff;
}
.dropdown-item {
  padding: 10px 16px; font-size: 13px; color: var(--text);
  text-decoration: none; transition: background 0.2s; cursor: pointer;
  border: none; background: none; text-align: left; width: 100%;
}
.dropdown-item:hover { background: rgba(184,134,11,0.08); color: var(--primary); }
.dropdown-item.active { color: var(--primary); font-weight: 600; }

/* ✅ 搜索框 - 增加过渡动画 */
.search-overlay {
  position: fixed; inset: 0; background: rgba(0,0,0,0.5);
  z-index: 300; display: flex; align-items: flex-start; justify-content: center;
  padding-top: 80px;
  opacity: 0; visibility: hidden; transition: opacity 0.25s ease, visibility 0.25s ease;
}
.search-overlay.show { opacity: 1; visibility: visible; }
.search-box {
  background: #fff; border-radius: 16px; padding: 20px;
  width: 90%; max-width: 500px; box-shadow: 0 12px 40px rgba(0,0,0,0.2);
  transform: translateY(-20px); transition: transform 0.25s ease;
}
.search-overlay.show .search-box { transform: translateY(0); }

.search-input-wrapper {
  display: flex; align-items: center; gap: 10px;
  border: 2px solid #eee; border-radius: 24px; padding: 8px 8px 8px 20px;
  transition: border-color 0.25s;
}
.search-input-wrapper:focus-within { border-color: var(--primary); }
.search-input-wrapper svg { flex-shrink: 0; color: var(--text-light); }
.search-input {
  flex: 1; border: none; outline: none; font-size: 15px;
  font-family: inherit; background: transparent; min-width: 0;
}
.search-input::placeholder { color: #ccc; }

/* ✅ 新增搜索按钮样式 */
.search-submit-btn {
  flex-shrink: 0; background: var(--primary); color: #fff;
  border: none; border-radius: 18px; padding: 8px 18px;
  font-size: 14px; font-weight: 500; cursor: pointer;
  transition: background 0.25s, transform 0.1s; white-space: nowrap;
}
.search-submit-btn:hover { background: var(--primary-light); }
.search-submit-btn:active { transform: scale(0.96); }

.search-close { margin-top: 16px; text-align: center; }
.search-close-btn {
  background: none; border: none; color: var(--text-light);
  font-size: 13px; cursor: pointer; padding: 8px 16px;
}
.search-close-btn:hover { color: var(--primary); }

/* 产品网格 */
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 16px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.card {
  background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  transition: transform 0.3s, box-shadow 0.3s; text-decoration: none; color: inherit; display: block;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
.card-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #f0ece6; display: block; }
.card-info { padding: 10px 12px 14px; }
.card-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-price { font-size: 14px; color: var(--primary); font-weight: 600; }
.card-category { font-size: 11px; color: var(--text-light); margin-top: 2px; }

/* 空状态 */
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.loading { text-align: center; padding: 60px 20px; color: var(--text-light); }
.loading .spinner {
  width: 32px; height: 32px; border: 3px solid #eee; border-top-color: var(--primary);
  border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }

@media (max-width: 480px) {
  .bottom-nav { padding: 10px 16px; gap: 8px; }
  .nav-item { padding: 6px 8px; font-size: 10px; }
  .nav-icon { font-size: 18px; }
}
</style>
</head>
<body tabindex="-1">

<!-- 顶部标题栏 -->
<header class="header">
  <a href="../index.html" class="header-nav-btn">首页</a>
  <h1>✦ 绒颜 ✦</h1>
  <a href="./admin.html" class="header-nav-btn">管理</a>
</header>

<!-- 产品网格 -->
<div class="grid" id="productGrid">
  <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
</div>

<!-- 底部悬浮导航栏 -->
<nav class="bottom-nav">
  <div class="nav-item" id="categoryBtn">
    <span class="nav-icon">📂</span>
    <span>分类</span>
    <div class="dropdown" id="categoryDropdown">
      <button class="dropdown-item active" data-category="all">全部</button>
      <button class="dropdown-item" data-category="发饰">发饰</button>
      <button class="dropdown-item" data-category="耳饰">耳饰</button>
      <button class="dropdown-item" data-category="胸饰">胸饰</button>
      <button class="dropdown-item" data-category="其他">其他</button>
    </div>
  </div>

  <div class="nav-item" id="searchBtn">
    <span class="nav-icon">🔍</span>
    <span>搜索</span>
  </div>

  <div class="nav-item" id="sortBtn">
    <span class="nav-icon">↕️</span>
    <span>排序</span>
    <div class="dropdown" id="sortDropdown">
      <button class="dropdown-item active" data-sort="newest">最新发布</button>
      <button class="dropdown-item" data-sort="price-asc">价格升序</button>
      <button class="dropdown-item" data-sort="price-desc">价格降序</button>
    </div>
  </div>
</nav>

<!-- 搜索遮罩 -->
<div class="search-overlay" id="searchOverlay">
  <div class="search-box">
    <div class="search-input-wrapper">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"></circle>
        <path d="m21 21-4.35-4.35"></path>
      </svg>
      <!-- ✅ 新增搜索按钮 -->
      <input type="text" class="search-input" id="searchInput" placeholder="搜索产品名称...">
      <button class="search-submit-btn" id="searchSubmitBtn">搜索</button>
    </div>
    <div class="search-close">
      <button class="search-close-btn" id="searchCloseBtn">关闭</button>
    </div>
  </div>
</div>

<script>
(function () {
  'use strict';

  const GITHUB_OWNER = 'yangruan1688';
  const GITHUB_REPO  = 'yangruan.github.io';
  const SEARCH_API = `https://api.github.com/search/issues?q=repo:${GITHUB_OWNER}/${GITHUB_REPO}+is:issue+state:open+label:product&per_page=100&sort=created&order=desc`;

  let allProducts = [];
  let currentCategory = 'all';
  let currentSort = 'newest';
  let currentSearch = '';
  let lastLoadTime = 0;

  const productGrid = document.getElementById('productGrid');
  const categoryBtn = document.getElementById('categoryBtn');
  const categoryDropdown = document.getElementById('categoryDropdown');
  const searchBtn = document.getElementById('searchBtn');
  const searchOverlay = document.getElementById('searchOverlay');
  const searchInput = document.getElementById('searchInput');
  const searchSubmitBtn = document.getElementById('searchSubmitBtn');
  const searchCloseBtn = document.getElementById('searchCloseBtn');
  const sortBtn = document.getElementById('sortBtn');
  const sortDropdown = document.getElementById('sortDropdown');

  function escapeHtml(str) {
    if (str == null) return '';
    return String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;').replace(/'/g,'&#39;').replace(/`/g,'&#96;');
  }

  function resolveImageUrl(url) {
    if (!url) return '';
    if (url.startsWith('http')) return url;
    return `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/main/${url}`;
  }

  async function fetchProducts() {
    const controller = new AbortController();
    const id = setTimeout(() => controller.abort(), 10000);
    try {
      const res = await fetch(SEARCH_API, {
        signal: controller.signal, cache: 'no-store',
        headers: { Accept: 'application/vnd.github.v3+json' }
      });
      clearTimeout(id);
      if (!res.ok) throw new Error(`HTTP ${res.status}`);
      const data = await res.json();
      return (data.items || []).map(issue => {
        let bodyData = {};
        try { bodyData = JSON.parse(issue.body || '{}'); } catch(e) {}
        const catLabel = issue.labels.find(l => l.name.startsWith('cat:'));
        return {
          id: issue.number, name: issue.title,
          category: catLabel ? catLabel.name.replace('cat:', '') : '',
          createdAt: issue.created_at, ...bodyData
        };
      });
    } catch (e) {
      clearTimeout(id);
      console.error('Failed to fetch products:', e);
      return null;
    }
  }

  async function loadProducts() {
    productGrid.innerHTML = '<div class="loading"><div class="spinner"></div><p>加载中...</p></div>';
    const products = await fetchProducts();
    if (products === null) {
      productGrid.innerHTML = '<div class="empty-state"><div class="empty-icon">⚠️</div><p>加载失败，请刷新页面重试</p></div>';
      return;
    }
    if (products.length === 0) {
      productGrid.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><p>暂无产品，敬请期待</p></div>';
      return;
    }
    allProducts = products;
    lastLoadTime = Date.now();
    renderProducts();
  }

  function filterAndSortProducts() {
    let filtered = allProducts;
    if (currentCategory !== 'all') {
      filtered = filtered.filter(p => p.category === currentCategory);
    }
    if (currentSearch) {
      const searchLower = currentSearch.toLowerCase();
      filtered = filtered.filter(p => 
        (p.name || '').toLowerCase().includes(searchLower) ||
        (p.description || '').toLowerCase().includes(searchLower)
      );
    }
    if (currentSort === 'price-asc') {
      filtered.sort((a, b) => (a.price || 0) - (b.price || 0));
    } else if (currentSort === 'price-desc') {
      filtered.sort((a, b) => (b.price || 0) - (a.price || 0));
    } else if (currentSort === 'newest') {
      filtered.sort((a, b) => new Date(b.createdAt) - new Date(a.createdAt));
    }
    return filtered;
  }

  function renderProducts() {
    const filtered = filterAndSortProducts();
    if (filtered.length === 0) {
      productGrid.innerHTML = '<div class="empty-state"><div class="empty-icon">📭</div><p>未找到匹配的产品</p></div>';
      return;
    }
    productGrid.innerHTML = filtered.map(p => {
      const safeName = escapeHtml(p.name || '');
      const safeCover = escapeHtml(resolveImageUrl(p.cover) || '');
      const safePrice = Number(p.price || 0).toFixed(1);
      const safeCategory = escapeHtml(p.category || '');
      return `
        <a class="card" href="./detail.html?id=${p.id}">
          <img class="card-img" src="${safeCover}" alt="${safeName}" loading="lazy" decoding="async"
               onerror="this.style.background='#f0ece6';this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 1 1%22><rect fill=%22%23f0ece6%22 width=%221%22 height=%221%22/></svg>'">
          <div class="card-info">
            <div class="card-name">${safeName}</div>
            <div class="card-price">¥${safePrice}</div>
            <div class="card-category">${safeCategory}</div>
          </div>
        </a>`;
    }).join('');
  }

  // ========== 分类 ==========
  categoryBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    categoryDropdown.classList.toggle('show');
    sortDropdown.classList.remove('show');
  });
  categoryDropdown.addEventListener('click', (e) => {
    const item = e.target.closest('.dropdown-item');
    if (!item) return;
    e.stopPropagation();
    currentCategory = item.dataset.category;
    categoryDropdown.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    categoryDropdown.classList.remove('show');
    renderProducts();
  });

  // ========== ✅ 搜索功能（按钮触发 + 自动关闭） ==========
  function doSearch() {
    currentSearch = searchInput.value.trim();
    renderProducts();
    // 搜索后自动关闭弹窗，直接展示结果
    searchOverlay.classList.remove('show');
    document.body.focus(); // 释放焦点，收起移动端键盘
  }

  searchBtn.addEventListener('click', () => {
    searchOverlay.classList.add('show');
    setTimeout(() => searchInput.focus(), 100);
  });

  searchSubmitBtn.addEventListener('click', doSearch);

  searchInput.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') { e.preventDefault(); doSearch(); }
  });

  searchCloseBtn.addEventListener('click', () => {
    searchOverlay.classList.remove('show');
    searchInput.value = '';
    currentSearch = '';
    renderProducts();
    document.body.focus();
  });

  searchOverlay.addEventListener('click', (e) => {
    if (e.target === searchOverlay) {
      searchOverlay.classList.remove('show');
      document.body.focus();
    }
  });

  // ESC 键关闭搜索
  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape' && searchOverlay.classList.contains('show')) {
      searchOverlay.classList.remove('show');
      document.body.focus();
    }
  });

  // ========== 排序 ==========
  sortBtn.addEventListener('click', (e) => {
    e.stopPropagation();
    sortDropdown.classList.toggle('show');
    categoryDropdown.classList.remove('show');
  });
  sortDropdown.addEventListener('click', (e) => {
    const item = e.target.closest('.dropdown-item');
    if (!item) return;
    e.stopPropagation();
    currentSort = item.dataset.sort;
    sortDropdown.querySelectorAll('.dropdown-item').forEach(i => i.classList.remove('active'));
    item.classList.add('active');
    sortDropdown.classList.remove('show');
    renderProducts();
  });

  document.addEventListener('click', () => {
    categoryDropdown.classList.remove('show');
    sortDropdown.classList.remove('show');
  });

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible' && Date.now() - lastLoadTime > 5000) loadProducts();
  });
  window.addEventListener('pageshow', (e) => { if (e.persisted) loadProducts(); });

  loadProducts();
})();
</script>
</body>
</html>
