<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>绒颜</title>
<link rel="icon" href="../logo.jpg" type="image/jpeg">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --primary: #b8860b;
    --primary-light: #d4a843;
    --bg: #faf8f5;
    --card-bg: #ffffff;
    --text: #2c2c2c;
    --text-light: #888;
    --shadow: 0 2px 16px rgba(0,0,0,0.07);
    --shadow-hover: 0 8px 32px rgba(0,0,0,0.12);
    --radius: 12px;
    --nav-height: 72px;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
                 'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
    background: var(--bg);
    color: var(--text);
    -webkit-font-smoothing: antialiased;
    padding-top: 130px;
    overflow-x: hidden;
  }

  .navbar {
    position: fixed;
    top: 0; left: 0; right: 0;
    z-index: 1000;
    min-height: var(--nav-height);
    background: rgba(255,255,255,0.92);
    backdrop-filter: blur(20px);
    -webkit-backdrop-filter: blur(20px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    display: flex;
    flex-direction: column;
    justify-content: center;
    padding: 10px 12px 0;
  }
  .navbar-brand {
    display: flex;
    align-items: center;
    width: 100%;
    font-size: 13px;
    letter-spacing: 6px;
    color: var(--primary);
    font-weight: 600;
    margin-bottom: 6px;
    text-transform: uppercase;
  }
  .navbar-brand .brand-text { flex: 1; text-align: center; }
  .nav-side-btn {
    flex: 1;
    display: inline-flex;
    align-items: center;
    font-size: 13px;
    letter-spacing: 1px;
    color: var(--primary);
    text-decoration: none;
    font-weight: 500;
    padding: 4px 10px;
    border-radius: 20px;
    transition: all 0.3s ease;
    cursor: pointer;
    border: none;
    background: none;
  }
  .nav-side-btn:hover { background: rgba(184,134,11,0.08); color: var(--primary-light); }
  .nav-side-btn .back-icon { margin-right: 3px; font-size: 16px; line-height: 1; }
  .nav-side-btn.right { justify-content: flex-end; }

  .navbar-categories {
    display: flex;
    justify-content: center;
    gap: 6px;
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
    scrollbar-width: none;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
    mask-image: linear-gradient(to right, transparent 0%, black 5%, black 95%, transparent 100%);
    padding: 2px 8px;
  }
  .navbar-categories::-webkit-scrollbar { display: none; }
  .nav-btn {
    flex-shrink: 0;
    padding: 5px 14px;
    border: none;
    background: transparent;
    color: var(--text);
    font-size: 13px;
    border-radius: 20px;
    cursor: pointer;
    transition: all 0.3s ease;
    font-weight: 500;
    white-space: nowrap;
    position: relative;
  }
  .nav-btn:hover { color: var(--primary); background: rgba(184,134,11,0.06); }
  .nav-btn.active { background: var(--primary); color: #fff; box-shadow: 0 2px 12px rgba(184,134,11,0.3); }
  .nav-btn .nav-icon { margin-right: 4px; font-size: 14px; }

  .toolbar {
    position: fixed;
    top: 0;
    left: 0; right: 0;
    z-index: 999;
    background: rgba(255,255,255,0.95);
    backdrop-filter: blur(16px);
    -webkit-backdrop-filter: blur(16px);
    border-bottom: 1px solid rgba(0,0,0,0.06);
    padding: 8px 16px;
    display: flex;
    align-items: center;
    gap: 10px;
    overflow: visible;
  }
  .toolbar-btn {
    display: inline-flex;
    align-items: center;
    gap: 4px;
    padding: 6px 14px;
    border: 1px solid rgba(0,0,0,0.1);
    background: #fff;
    border-radius: 20px;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    transition: all 0.25s ease;
    white-space: nowrap;
    position: relative;
    flex-shrink: 0;
  }
  .toolbar-btn:hover { border-color: var(--primary); color: var(--primary); }
  .toolbar-btn.active { border-color: var(--primary); color: var(--primary); background: rgba(184,134,11,0.06); }
  .toolbar-btn .btn-icon { font-size: 14px; }

  .sort-dropdown {
    position: absolute;
    top: calc(100% + 6px);
    left: 0;
    background: #fff;
    border-radius: 10px;
    box-shadow: 0 4px 24px rgba(0,0,0,0.12);
    min-width: 130px;
    overflow: hidden;
    opacity: 0;
    visibility: hidden;
    transform: translateY(-8px);
    transition: all 0.25s ease;
    z-index: 1002;
  }
  .sort-dropdown.show { opacity: 1; visibility: visible; transform: translateY(0); }
  .sort-dropdown .sort-option {
    display: block;
    width: 100%;
    padding: 10px 16px;
    border: none;
    background: none;
    text-align: left;
    font-size: 13px;
    color: var(--text);
    cursor: pointer;
    transition: background 0.2s;
  }
  .sort-dropdown .sort-option:hover { background: rgba(184,134,11,0.08); }
  .sort-dropdown .sort-option.active { color: var(--primary); font-weight: 600; }

  .search-container {
    flex: 1;
    display: flex;
    align-items: center;
    overflow: hidden;
    max-width: 0;
    opacity: 0;
    transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    min-width: 0;
  }
  .search-container.show { max-width: 400px; opacity: 1; }
  .search-input-wrap {
    flex: 1;
    position: relative;
    display: flex;
    align-items: center;
    width: 100%;
  }
  .search-input {
    width: 100%;
    padding: 7px 36px 7px 14px;
    border: 1px solid rgba(0,0,0,0.1);
    border-radius: 20px;
    font-size: 13px;
    outline: none;
    transition: border-color 0.25s;
    background: #fff;
  }
  .search-input:focus { border-color: var(--primary); }
  .search-input::placeholder { color: #bbb; }
  .search-clear {
    position: absolute;
    right: 10px;
    top: 50%;
    transform: translateY(-50%);
    background: none;
    border: none;
    color: #bbb;
    font-size: 16px;
    cursor: pointer;
    padding: 2px;
    display: none;
    line-height: 1;
  }
  .search-clear.show { display: block; }
  .search-clear:hover { color: var(--text); }

  @media (max-width: 480px) {
    .navbar { padding: 8px 8px 0; }
    .navbar-brand { font-size: 12px; letter-spacing: 4px; margin-bottom: 4px; }
    .nav-side-btn { font-size: 12px; padding: 3px 8px; }
    .nav-side-btn .back-icon { font-size: 14px; }
    .navbar-categories { justify-content: flex-start; gap: 4px; }
    .nav-btn { padding: 4px 12px; font-size: 12px; }
    .nav-btn .nav-icon { font-size: 13px; margin-right: 2px; }
    .toolbar { padding: 6px 10px; gap: 8px; }
    .toolbar-btn { padding: 5px 10px; font-size: 12px; }
    .search-container.show { max-width: none; }
    .search-input { padding: 6px 32px 6px 12px; font-size: 12px; }
  }

  .main-container { max-width: 1200px; margin: 0 auto; padding: 24px 16px 60px; }
  .section-title { text-align: center; margin-bottom: 28px; font-size: 15px; color: var(--text-light); letter-spacing: 2px; }
  .section-title span { color: var(--primary); font-weight: 600; }
  .product-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(160px, 1fr)); gap: 16px; }
  @media (min-width: 768px) {
    .product-grid { grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 24px; }
  }
  .product-card {
    background: var(--card-bg);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    cursor: pointer;
    transition: all 0.35s cubic-bezier(0.25, 0.46, 0.45, 0.94);
    text-decoration: none;
    color: inherit;
    display: block;
    animation: cardIn 0.5s ease backwards;
  }
  .product-card:hover { transform: translateY(-6px); box-shadow: var(--shadow-hover); }
  @keyframes cardIn { from { opacity: 0; transform: translateY(24px); } to { opacity: 1; transform: translateY(0); } }
  .product-card .card-img-wrap { position: relative; width: 100%; padding-top: 100%; overflow: hidden; background: #f0ece6; }
  .product-card .card-img-wrap img { position: absolute; top: 0; left: 0; width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s ease; }
  .product-card:hover .card-img-wrap img { transform: scale(1.06); }
  .product-card .card-tag { position: absolute; top: 10px; left: 10px; background: rgba(255,255,255,0.88); backdrop-filter: blur(6px); padding: 3px 10px; border-radius: 20px; font-size: 11px; color: var(--primary); font-weight: 600; }
  .product-card .card-info { padding: 14px 14px 16px; }
  .product-card .card-name { font-size: 14px; font-weight: 600; margin-bottom: 6px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
  .product-card .card-price { font-size: 18px; font-weight: 700; color: var(--primary); }
  .product-card .card-price::before { content: '¥'; font-size: 12px; margin-right: 1px; }
  .empty-state { text-align: center; padding: 80px 20px; color: var(--text-light); }
  .empty-state .empty-icon { font-size: 48px; margin-bottom: 16px; }
  .empty-state p { font-size: 15px; }
  .loading { text-align: center; padding: 60px; color: var(--text-light); }
  .loading .spinner { width: 32px; height: 32px; border: 3px solid #eee; border-top-color: var(--primary); border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .footer { text-align: center; padding: 30px; color: var(--text-light); font-size: 12px; letter-spacing: 1px; border-top: 1px solid rgba(0,0,0,0.05); margin-top: 40px; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: transparent; }
  ::-webkit-scrollbar-thumb { background: #d0c8b8; border-radius: 3px; }
</style>
</head>
<body>

<nav class="navbar" id="navbar">
  <div class="navbar-brand">
    <a href="../index.html" class="nav-side-btn" title="返回上一级">
      <span class="back-icon">←</span>返回
    </a>
    <span class="brand-text">✦ 绒颜 ✦</span>
    <a href="admin.html" class="nav-side-btn right" title="进入管理后台">
      ⚙️管理
    </a>
  </div>
  <div class="navbar-categories" id="navCategories">
    <button class="nav-btn active" data-category="全部"><span class="nav-icon">🏠</span>全部</button>
    <button class="nav-btn" data-category="发饰"><span class="nav-icon">💇‍♀️</span>发饰</button>
    <button class="nav-btn" data-category="耳饰"><span class="nav-icon">✨</span>耳饰</button>
    <button class="nav-btn" data-category="胸饰"><span class="nav-icon">🌸</span>胸饰</button>
    <button class="nav-btn" data-category="其他"><span class="nav-icon">🎁</span>其他</button>
  </div>
</nav>

<div class="toolbar" id="toolbar">
  <div style="position:relative; flex-shrink: 0;">
    <button class="toolbar-btn" id="sortBtn">
      <span class="btn-icon">↕</span>排序
    </button>
    <div class="sort-dropdown" id="sortDropdown">
      <button class="sort-option active" data-sort="default">默认排序</button>
      <button class="sort-option" data-sort="price-asc">价格升序</button>
      <button class="sort-option" data-sort="price-desc">价格降序</button>
      <button class="sort-option" data-sort="newest">最新上架</button>
    </div>
  </div>
  <button class="toolbar-btn" id="searchBtn">
    <span class="btn-icon">🔍</span>搜索
  </button>
  <div class="search-container" id="searchContainer">
    <div class="search-input-wrap">
      <input type="text" class="search-input" id="searchInput" placeholder="搜索产品名称...">
      <button class="search-clear" id="searchClear">×</button>
    </div>
  </div>
</div>

<div class="main-container">
  <div class="section-title" id="sectionTitle">
    —— 为你精选 <span>全部</span> 饰品 ——
  </div>
  <div class="product-grid" id="productGrid">
    <div class="loading">
      <div class="spinner"></div>
      <p>正在加载产品...</p>
    </div>
  </div>
</div>

<div class="footer">绒颜 · rongyan@yangruan.cn</div>

<script>
(function () {
  // ⚠️⚠️⚠️ 修改为你自己的 GitHub 配置（只需要 owner、repo、branch）⚠️⚠️⚠️
  const GITHUB_OWNER = 'yangruan1688';
  const GITHUB_REPO  = 'yangruan.github.io';
  const GITHUB_BRANCH = 'main';

  // ✅ 修改：CDN 地址 + GitHub Raw 备用地址
  const PRODUCTS_URL = `https://cdn.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/rongyan/products.json`;
  const PRODUCTS_FALLBACK_URL = `https://raw.githubusercontent.com/${GITHUB_OWNER}/${GITHUB_REPO}/${GITHUB_BRANCH}/rongyan/products.json`;

  let allProducts = [];
  let currentCategory = '全部';
  let currentSort = 'default';
  let currentSearch = '';

  const grid = document.getElementById('productGrid');
  const navContainer = document.getElementById('navCategories');
  const sectionTitle = document.getElementById('sectionTitle');
  const navbar = document.getElementById('navbar');
  const sortBtn = document.getElementById('sortBtn');
  const sortDropdown = document.getElementById('sortDropdown');
  const searchBtn = document.getElementById('searchBtn');
  const searchContainer = document.getElementById('searchContainer');
  const searchInput = document.getElementById('searchInput');
  const searchClear = document.getElementById('searchClear');
  const toolbar = document.getElementById('toolbar');

  function updateToolbarPosition() {
    const navH = navbar.offsetHeight;
    const toolH = toolbar.offsetHeight;
    toolbar.style.top = navH + 'px';
    document.body.style.paddingTop = (navH + toolH + 8) + 'px';
  }
  updateToolbarPosition();
  window.addEventListener('resize', updateToolbarPosition);
  window.addEventListener('load', updateToolbarPosition);

  // ✅ 修改：加载产品数据，增加 GitHub Raw 回退机制
  async function loadProducts() {
    try {
      // 优先从 CDN 加载（速度快）
      let res = await fetch(PRODUCTS_URL + '?_=' + Date.now());
      
      // ✅ 修改：CDN 失败时回退到 GitHub Raw（无缓存，数据最新）
      if (!res.ok) {
        console.warn('CDN 加载失败，回退到 GitHub Raw...');
        res = await fetch(PRODUCTS_FALLBACK_URL + '?_=' + Date.now());
      }
      
      if (!res.ok) throw new Error('HTTP ' + res.status);
      const data = await res.json();
      allProducts = data || [];
      updateView();
      updateToolbarPosition();
    } catch (err) {
      console.error('加载产品失败:', err);
      if (err.message.includes('404')) {
        allProducts = [];
        updateView();
      } else {
        // ✅ 修改：CDN 出错时再试一次 GitHub Raw
        try {
          const res = await fetch(PRODUCTS_FALLBACK_URL + '?_=' + Date.now());
          if (res.ok) {
            const data = await res.json();
            allProducts = data || [];
            updateView();
            updateToolbarPosition();
            return;
          }
        } catch (e2) {
          console.error('备用加载也失败:', e2);
        }
        
        grid.innerHTML = `
          <div class="empty-state" style="grid-column:1/-1">
            <div class="empty-icon">😢</div>
            <p>产品加载失败，请检查网络连接</p>
          </div>`;
      }
    }
  }

  loadProducts();

  navContainer.addEventListener('click', function (e) {
    const btn = e.target.closest('.nav-btn');
    if (!btn) return;
    navContainer.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentCategory = btn.dataset.category;
    updateView();
    btn.scrollIntoView({ behavior: 'smooth', block: 'nearest', inline: 'center' });
  });

  sortBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    sortDropdown.classList.toggle('show');
    sortBtn.classList.toggle('active');
  });

  sortDropdown.addEventListener('click', function (e) {
    const option = e.target.closest('.sort-option');
    if (!option) return;
    sortDropdown.querySelectorAll('.sort-option').forEach(o => o.classList.remove('active'));
    option.classList.add('active');
    currentSort = option.dataset.sort;
    sortBtn.innerHTML = `<span class="btn-icon">↕</span>${option.textContent}`;
    sortDropdown.classList.remove('show');
    sortBtn.classList.remove('active');
    updateView();
    updateToolbarPosition();
  });

  searchBtn.addEventListener('click', function (e) {
    e.stopPropagation();
    const isShowing = searchContainer.classList.contains('show');
    searchContainer.classList.toggle('show');
    searchBtn.classList.toggle('active');
    if (!isShowing) {
      setTimeout(() => searchInput.focus(), 350);
    } else {
      searchInput.value = '';
      currentSearch = '';
      searchClear.classList.remove('show');
      updateView();
    }
  });

  let searchTimer = null;
  searchInput.addEventListener('input', function () {
    const val = this.value.trim();
    searchClear.classList.toggle('show', val.length > 0);
    clearTimeout(searchTimer);
    searchTimer = setTimeout(() => {
      currentSearch = val;
      updateView();
    }, 300);
  });

  searchClear.addEventListener('click', function () {
    searchInput.value = '';
    currentSearch = '';
    searchClear.classList.remove('show');
    searchInput.focus();
    updateView();
  });

  document.addEventListener('click', function (e) {
    if (!sortBtn.contains(e.target) && !sortDropdown.contains(e.target)) {
      sortDropdown.classList.remove('show');
      sortBtn.classList.remove('active');
    }
    if (searchContainer.classList.contains('show') && !toolbar.contains(e.target)) {
      searchContainer.classList.remove('show');
      searchBtn.classList.remove('active');
    }
  });

  document.addEventListener('keydown', function (e) {
    if (e.key === 'Escape') {
      if (searchContainer.classList.contains('show')) {
        searchInput.blur();
        searchContainer.classList.remove('show');
        searchBtn.classList.remove('active');
      }
      if (sortDropdown.classList.contains('show')) {
        sortDropdown.classList.remove('show');
        sortBtn.classList.remove('active');
      }
    }
  });

  function updateView() {
    let products = currentCategory === '全部'
      ? [...allProducts]
      : allProducts.filter(p => p.category === currentCategory);

    if (currentSearch) {
      products = products.filter(p =>
        p.name.toLowerCase().includes(currentSearch.toLowerCase())
      );
    }

    switch (currentSort) {
      case 'price-asc':  products.sort((a, b) => a.price - b.price); break;
      case 'price-desc': products.sort((a, b) => b.price - a.price); break;
      case 'newest':     products.sort((a, b) => b.id - a.id); break;
    }

    if (currentSearch) {
      sectionTitle.innerHTML = `—— 搜索 "<span>${currentSearch}</span>" 的结果 (${products.length}) ——`;
    } else {
      sectionTitle.innerHTML = `—— 为你精选 <span>${currentCategory}</span> 饰品 ——`;
    }

    renderProducts(products);
  }

  function renderProducts(products) {
    if (products.length === 0) {
      grid.innerHTML = `
        <div class="empty-state" style="grid-column:1/-1">
          <div class="empty-icon">🔍</div>
          <p>${currentSearch ? '未找到相关产品' : '该分类暂无产品'}</p>
        </div>`;
      return;
    }
    grid.innerHTML = products.map((p, i) => `
      <a class="product-card" href="detail.html?id=${p.id}"
         style="animation-delay:${i * 0.06}s">
        <div class="card-img-wrap">
          <img src="${p.cover}" alt="${p.name}" loading="lazy">
          <span class="card-tag">${p.category}</span>
        </div>
        <div class="card-info">
          <div class="card-name">${p.name}</div>
          <div class="card-price">${p.price.toFixed(1)}</div>
        </div>
      </a>
    `).join('');
  }
})();
</script>
</body>
</html>
