<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>绒颜 · 手工发饰</title>
<meta name="description" content="绒颜 - 原创手工发饰品牌，每一件都是独一无二的手作好物。">
<link rel="icon" href="https://raw.githubusercontent.com/yangruan1688/yangruan.github.io/main/logo.jpg" type="image/jpeg">
<link rel="preconnect" href="https://raw.githubusercontent.com" crossorigin>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<link rel="preconnect" href="https://gcore.jsdelivr.net" crossorigin>
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
:root {
  --primary: #b8860b;
  --primary-light: #d4a843;
  --bg: #faf8f5;
  --card-bg: #ffffff;
  --text: #2c2c2c;
  --text-light: #999;
  --shadow: 0 2px 12px rgba(0,0,0,0.06);
  --radius: 12px;
}
html { scroll-behavior: smooth; }
body {
  font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC',
               'Hiragino Sans GB', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text);
  -webkit-font-smoothing: antialiased; min-height: 100vh;
}
.header {
  position: sticky; top: 0; z-index: 100;
  background: rgba(255,255,255,0.95); backdrop-filter: blur(16px);
  -webkit-backdrop-filter: blur(16px);
  border-bottom: 1px solid rgba(0,0,0,0.06);
  padding: 12px 16px; display: flex; align-items: center; justify-content: space-between;
}
.header h1 { font-size: 18px; color: var(--primary); letter-spacing: 4px; font-weight: 600; }
.header nav { display: flex; gap: 16px; align-items: center; }
.header nav a {
  color: var(--text); text-decoration: none; font-size: 13px; font-weight: 500;
  padding: 5px 10px; border-radius: 18px; transition: all 0.25s;
}
.header nav a:hover, .header nav a.active { background: rgba(184,134,11,0.1); color: var(--primary); }
.hero { text-align: center; padding: 40px 16px 28px; background: linear-gradient(180deg, #fdfcfa 0%, var(--bg) 100%); }
.hero h2 { font-size: 24px; letter-spacing: 6px; color: var(--primary); font-weight: 300; margin-bottom: 8px; }
.hero p { font-size: 13px; color: var(--text-light); letter-spacing: 2px; }
.filter-bar { display: flex; gap: 8px; padding: 12px 16px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.filter-bar::-webkit-scrollbar { display: none; }
.filter-btn {
  padding: 7px 18px; border: 1px solid rgba(0,0,0,0.1); background: #fff; border-radius: 20px;
  font-size: 13px; color: var(--text); cursor: pointer; transition: all 0.25s; white-space: nowrap; font-weight: 500;
}
.filter-btn:hover { border-color: var(--primary); color: var(--primary); }
.filter-btn.active { background: var(--primary); color: #fff; border-color: var(--primary); }
.grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; padding: 8px 16px 80px; }
@media (min-width: 600px) { .grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 900px) { .grid { grid-template-columns: repeat(4, 1fr); } }
.card {
  background: var(--card-bg); border-radius: var(--radius); overflow: hidden; box-shadow: var(--shadow);
  transition: transform 0.3s, box-shadow 0.3s; text-decoration: none; color: inherit; display: block;
}
.card:hover { transform: translateY(-4px); box-shadow: 0 8px 24px rgba(0,0,0,0.1); }
.card-img { width: 100%; aspect-ratio: 1; object-fit: cover; background: #f0ece6; display: block; }
.card-info { padding: 10px 12px 14px; }
.card-name { font-size: 14px; font-weight: 600; margin-bottom: 4px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.card-price { font-size: 14px; color: var(--primary); font-weight: 600; }
.card-category { font-size: 11px; color: var(--text-light); margin-top: 2px; }
.empty-state { text-align: center; padding: 60px 20px; color: var(--text-light); }
.empty-state .empty-icon { font-size: 48px; margin-bottom: 12px; }
.loading { text-align: center; padding: 60px 20px; color: var(--text-light); }
.loading .spinner {
  width: 32px; height: 32px; border: 3px solid #eee; border-top-color: var(--primary);
  border-radius: 50%; animation: spin 0.8s linear infinite; margin: 0 auto 12px;
}
@keyframes spin { to { transform: rotate(360deg); } }
.footer { text-align: center; padding: 20px; font-size: 11px; color: var(--text-light); border-top: 1px solid rgba(0,0,0,0.05); }
.footer a { color: var(--primary); text-decoration: none; }
</style>
</head>
<body>

<header class="header">
  <h1>✦ 绒颜 ✦</h1>
  <nav>
    <a href="index.html" class="active">首页</a>
    <a href="#about">关于</a>
    <a href="https://weidian.com/s/xxxxxxxxx" target="_blank" rel="noopener">微店</a>
  </nav>
</header>

<section class="hero">
  <h2>绒 颜</h2>
  <p>原创手工发饰 · 每一件都是独一无二</p>
</section>

<div class="filter-bar" id="filterBar">
  <button class="filter-btn active" data-category="all">全部</button>
</div>

<div class="grid" id="productGrid">
  <div class="loading"><div class="spinner"></div><p>加载中...</p></div>
</div>

<footer class="footer">
  <p>© 2025 绒颜 RongYan · 手工原创设计</p>
</footer>

<!-- CSS 保持原样，替换 <script> -->
<script>
(function () {
  'use strict';

  const GITHUB_OWNER = 'yangruan1688';
  const GITHUB_REPO = 'yangruan.github.io';
  const GITHUB_BRANCH = 'main';
  const SYNC_PATH = 'rongyan/sync.json';
  
  // 使用 Gcore CDN 获取 sync 信标，获取最新的 commit SHA
  const SYNC_URL = `https://gcore.jsdelivr.net/gh/${GITHUB_OWNER}/${GITHUB_REPO}@${GITHUB_BRANCH}/${SYNC_PATH}`;
  
  // Issues API 端点 (无需 Token 即可读取公开仓库，限额 60次/小时/IP)
  const ISSUES_API = `https://api.github.com/repos/${GITHUB_OWNER}/${GITHUB_REPO}/issues?state=open&labels=product&per_page=100`;

  let allProducts = [];
  let currentCategory = 'all';
  let currentCommitSha = GITHUB_BRANCH; // 默认使用分支名，后续动态更新

  const filterBar = document.getElementById('filterBar');
  const productGrid = document.getElementById('productGrid');

  function escapeHtml(str) {
    return str == null ? '' : String(str).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
  }

  // 获取最新的 Commit SHA (用于 CDN 精准缓存)
  async function getLatestVersion() {
    try {
      const res = await fetch(`${SYNC_URL}?_=${Date.now()}`, { cache: 'no-store' });
      if (res.ok) {
        // jsDelivr 支持 @commit_sha 语法，但我们这里用 sync.json 里的时间戳作为伪版本号
        // 或者直接获取该文件的 commit sha。为了简单，我们直接用时间戳拼接
        const data = await res.json();
        return data.lastUpdated ? new Date(data.lastUpdated).getTime() : Date.now();
      }
    } catch (e) {}
    return Date.now();
  }

  async function loadProducts() {
    productGrid.innerHTML = '<div class="loading"><div class="spinner"></div><p>加载中...</p></div>';
    
    try {
      // 直接请求 Issues API (无需 Token，公开仓库支持)
      // 注意：如果遇到 Rate Limit，可回退到读取 products.json
      const res = await fetch(ISSUES_API, { 
        headers: { Accept: 'application/vnd.github.v3+json' },
        cache: 'no-store' 
      });
      
      if (!res.ok) throw new Error('API Limit');
      const issues = await res.json();
      
      allProducts = issues.map(issue => {
        try {
          const data = JSON.parse(issue.body);
          return {
            id: issue.number,
            name: issue.title,
            category: issue.labels.find(l => l.name.startsWith('cat:'))?.name.replace('cat:', '') || '',
            ...data
          };
        } catch (e) { return null; }
      }).filter(Boolean);

      renderFilters();
      renderProducts();
    } catch (e) {
      // Fallback: 如果 Issues API 被限流，回退到 CDN 读取静态 JSON (需要 Admin 额外生成)
      // 这里为了演示，直接显示错误
      productGrid.innerHTML = '<div class="empty-state"><p>数据加载受限，请稍后刷新</p></div>';
    }
  }

  function renderFilters() {
    const categories = {};
    allProducts.forEach(p => { if (p.category) categories[p.category] = (categories[p.category] || 0) + 1; });
    let html = '<button class="filter-btn active" data-category="all">全部</button>';
    Object.keys(categories).sort().forEach(cat => {
      html += `<button class="filter-btn" data-category="${escapeHtml(cat)}">${escapeHtml(cat)} (${categories[cat]})</button>`;
    });
    filterBar.innerHTML = html;
  }

  function renderProducts() {
    const filtered = currentCategory === 'all' ? allProducts : allProducts.filter(p => p.category === currentCategory);
    if (filtered.length === 0) {
      productGrid.innerHTML = '<div class="empty-state"><div class="empty-icon">📦</div><p>暂无产品</p></div>';
      return;
    }
    productGrid.innerHTML = filtered.slice().reverse().map(p => `
      <a class="card" href="detail.html?id=${p.id}">
        <img class="card-img" src="${escapeHtml(p.cover)}" alt="${escapeHtml(p.name)}" loading="lazy" decoding="async" onerror="this.style.background='#f0ece6'">
        <div class="card-info">
          <div class="card-name">${escapeHtml(p.name)}</div>
          <div class="card-price">¥${Number(p.price).toFixed(1)}</div>
          <div class="card-category">${escapeHtml(p.category)}</div>
        </div>
      </a>
    `).join('');
  }

  filterBar.addEventListener('click', (e) => {
    const btn = e.target.closest('.filter-btn');
    if (!btn) return;
    currentCategory = btn.dataset.category;
    filterBar.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    renderProducts();
  });

  // 监听 Admin 的更新信号
  window.addEventListener('storage', (e) => {
    if (e.key === '_ry_sync_version') loadProducts();
  });
  
  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState === 'visible') loadProducts();
  });

  loadProducts();
})();
</script>
</body>
</html>
